<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Finanças</title>
<meta name="theme-color" content="#08111F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: dark;
  --bg:#08111F; --s1:#0F1B30; --s2:#162644; --line:#22355C;
  --ink:#EEF2FA; --ink2:#A9B6CF; --ink3:#6F7FA0;
  --blue:#3D6BFF; --blue2:#86A8FF; --gold:#E8C27A;
  --green:#46D39A; --red:#FF8080;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 170px);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#view{max-width:560px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--s1);color:var(--ink2)}

/* cartão de saldo */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 20px;
  background:radial-gradient(120% 90% at 100% 0%,#2D59E0 0%,rgba(45,89,224,0) 60%),linear-gradient(160deg,#1A3680 0%,#0E1E4A 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hero .lbl{color:#C7D4F5;font-size:14px}
.hero .eye{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#DCE5FB}
.hero .big.oculto{letter-spacing:.08em}
.hero .big{font-size:42px;font-weight:700;margin:2px 0 14px;line-height:1.1}
.hero .after{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.hero .after span:first-child{color:#C7D4F5;font-size:14px}
.hero .after .num{color:var(--gold);font-size:20px;font-weight:600}
.hero .empty{margin-top:6px;color:#DCE5FB}
.hero .cta{margin-top:14px;background:rgba(255,255,255,.14);padding:10px 16px;border-radius:12px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 22px}
.stat{background:var(--s1);border-radius:18px;padding:12px 12px 14px}
.stat .lbl{color:var(--ink3);font-size:13px}
.stat .num{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap}
.stat{min-width:0;overflow:hidden}

h2{font-size:19px;font-weight:650;margin:22px 2px 10px;letter-spacing:-.01em}
h2 small{font-weight:400;color:var(--ink3);font-size:14px;margin-left:6px}
.sub{color:var(--ink3);font-size:14px}

/* listas */
.list{background:var(--s1);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>*:first-child .row{border-top:0}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{color:var(--ink3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.rv{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rv.entrada{color:var(--green)}
.rv.muted,.row.muted .rt{color:var(--ink3)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--s2);color:var(--ink2)}
.emptybox{background:var(--s1);border-radius:20px;padding:26px 18px;text-align:center;color:var(--ink2)}

/* navegação de período */
.pnav{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:16px;padding:6px;margin-bottom:12px}
.pnav button{width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--ink2)}
.pnav button:active{background:var(--s2)}
.pnav .pl{font-weight:600}
.pnav .pl::first-letter{text-transform:uppercase}
.seg{display:flex;background:var(--s1);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:15px}
.seg button.on{background:var(--s2);color:var(--ink)}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cmp{color:var(--ink2);font-size:14px;margin:-2px 2px 12px}

/* gráficos */
.chart{background:var(--s1);border-radius:20px;padding:16px}
.chart svg{display:block;width:100%;height:auto}
.chart path,.chart rect{cursor:pointer}
.legend{margin-top:12px}
.legend .row{padding:10px 0;border-top:1px solid var(--line)}
.legend .row:first-child{border-top:0}
.legend .pct{color:var(--ink3);font-size:13px;width:44px;text-align:right}
.cap{text-align:center;color:var(--ink2);font-size:14px;margin-top:6px;min-height:20px}

/* faturas */
.fcard{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:12px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fhead b{font-size:17px}
.fitem{border-top:1px solid var(--line);padding:12px 0}
.fitem:first-of-type{border-top:0}
.fline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.chip-st{font-size:12px;padding:3px 8px;border-radius:7px;margin-left:6px}
.st-aberta{background:rgba(61,107,255,.18);color:var(--blue2)}
.st-fechada{background:rgba(232,194,122,.16);color:var(--gold)}
.st-vencida{background:rgba(255,128,128,.16);color:var(--red)}
.st-paga{background:rgba(70,211,154,.14);color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--s2);font-weight:600;font-size:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.full{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.danger{color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.proj{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.proj::-webkit-scrollbar{display:none}
.proj div{flex:none;background:var(--s2);border-radius:12px;padding:8px 12px;min-width:92px}
.proj small{display:block;color:var(--ink3);font-size:12px;text-transform:capitalize}
.items{margin-top:8px;background:var(--s2);border-radius:12px}
.items .row{padding:10px 12px}
.bar-prog{height:4px;background:var(--s2);border-radius:2px;margin-top:6px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--blue2);border-radius:2px}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,20,38,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-b) + 6px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
.fab{position:absolute;right:16px;bottom:calc(100% + 14px);width:58px;height:58px;border-radius:29px;margin:0;background:linear-gradient(160deg,#4F7BFF,#2A4FD6);color:#fff;display:grid!important;place-items:center;box-shadow:0 8px 24px rgba(42,79,214,.45)}
.fab svg{width:28px!important;height:28px!important}
nav.tabs .fab{color:#fff}

/* folha (modal) */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.amount{font-family:var(--num);font-size:40px;font-weight:700;text-align:center;background:transparent;border:0;padding:6px 0 10px}
.amount::placeholder{color:var(--ink3)}
.amount.gasto{color:var(--ink)}
.amount.entrada{color:var(--green)}
.field{margin-bottom:14px}
.field>label,.flabel{display:block;color:var(--ink3);font-size:13px;margin:0 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--s2);font-size:15px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;border:1px solid transparent}
.chip.on{color:var(--ink);border-color:var(--blue);background:rgba(61,107,255,.16)}
.chip .dot{width:8px;height:8px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--s2);font-size:20px}
.stepper .num{font-size:20px;font-weight:600;min-width:44px;text-align:center}
.hint{color:var(--ink2);font-size:14px;margin-top:6px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.switch input{width:auto;appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--s2);border:1px solid var(--line);position:relative;padding:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--blue);border-color:var(--blue)}
.switch input:checked::after{transform:translateX(20px)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}

.warnbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(232,194,122,.12);border:1px solid rgba(232,194,122,.35);color:#F2D9A6;border-radius:16px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.warnbar b{color:var(--gold)}
.topbtns{display:flex;gap:8px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.meta{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:12px;width:100%;text-align:left;display:block}
.meta .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta .mtop b{font-size:17px}
.meta .mval{margin-top:8px;font-size:22px;font-weight:700}
.meta .mval small{font-size:14px;color:var(--ink3);font-weight:500}
.gauge{height:8px;background:var(--s2);border-radius:4px;margin:10px 0 8px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3D6BFF,#86A8FF)}
.gauge.ok i{background:linear-gradient(90deg,#2FB985,#46D39A)}
.cal{background:var(--s1);border-radius:20px;padding:12px 12px 14px;margin-bottom:14px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .ch button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--ink2)}
.cal .ch b{font-weight:600}
.cal .ch b::first-letter{text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid .wd{text-align:center;font-size:11px;color:var(--ink3);padding-bottom:2px}
.cgrid button{aspect-ratio:1;border-radius:10px;font-size:14px;color:var(--ink2);display:grid;place-items:center;border:2px solid transparent;font-family:var(--num)}
.cgrid button.hoje{color:var(--ink);font-weight:700}
.cgrid button.sel{border-color:var(--ink)}
.cgrid button.fut{opacity:.35}
.clegend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;color:var(--ink3)}
.clegend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.wk .row{padding:9px 0;gap:10px}
.wk .row:first-of-type{border-top:0}
.wk .wl{width:34px;color:var(--ink2);font-size:14px}
.wk .wb{flex:1;height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.wk .wb i{display:block;height:100%;background:#3987e5;border-radius:0 4px 4px 0}
.wk .rv{min-width:96px;text-align:right;font-size:14px}
.cores{display:flex;flex-wrap:wrap;gap:10px}
.cores button{width:34px;height:34px;border-radius:17px;border:3px solid transparent}
.cores button.on{border-color:var(--ink)}
.subl .row{padding:10px 12px}
.split{background:var(--s2);border-radius:14px;padding:12px;margin:-4px 0 14px}
.code{display:block;background:var(--s2);border-radius:10px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--blue2);word-break:break-all;margin:6px 0 10px}
.toast.acao{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px}
.toast.acao button{background:rgba(255,255,255,.12);color:var(--gold);font-weight:600;padding:7px 12px;border-radius:9px;font-size:15px}
.ttag{font-size:12px;color:var(--blue2)}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(var(--safe-b) + 158px);transform:translate(-50%,20px);background:#22355C;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row.agrow{padding:0 14px 0 12px;gap:10px}
.agmain{padding:13px 0;text-align:left;flex:1;min-width:0;display:flex;flex-direction:column}
.ck{width:26px;height:26px;border-radius:13px;border:2px solid var(--ink3);flex:none;display:grid;place-items:center}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on::after{content:"";width:10px;height:5px;border-left:2px solid #08111F;border-bottom:2px solid #08111F;transform:translateY(-1px) rotate(-45deg)}
.agbar{width:4px;align-self:stretch;margin:12px 11px;border-radius:2px;background:var(--blue2);flex:none}
.rt.feito{text-decoration:line-through;color:var(--ink3)}
.late{color:var(--red)}
.agday{margin-top:18px}
.agday::first-letter{text-transform:uppercase}
.notifbox{background:rgba(61,107,255,.12);border:1px solid rgba(61,107,255,.35);border-radius:16px;padding:14px;margin-bottom:14px;color:#DCE5FB;font-size:14px}
.notifbox .btn{margin-top:10px}
.quick{display:flex;gap:8px;margin:0 0 14px}
.quick input{flex:1;min-width:0;border-radius:14px;background:var(--s1);border-color:var(--line);padding:13px 14px}
.quick button{width:48px;height:48px;border-radius:14px;background:var(--s1);border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--ink2)}
.quick button.go{background:var(--blue);border-color:var(--blue);color:#fff}
.quick button.ouvindo{background:#E5484D;border-color:#E5484D;color:#fff;animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.6}}
.desk{display:none!important}
.cols>div{min-width:0}
@media (min-width:900px){
  .ultimos{margin-top:0}
  body{padding:32px 40px 48px 280px}
  #view{max-width:1120px;margin:0}
  .desk{display:revert!important}
  nav.tabs button.desk{display:flex!important}
  div.desk{display:block!important}
  .mob{display:none!important}
  nav.tabs{top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding:28px 16px;background:var(--s1);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs .in{display:flex;flex-direction:column;gap:2px;max-width:none;height:100%}
  nav.tabs .brand{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0 10px 18px;color:var(--ink)}
  nav.tabs button{flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:12px;justify-content:flex-start;color:var(--ink2)}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button{width:100%;align-items:center}
  .topbtns .iconbtn{display:none}
  nav.tabs button:hover{background:rgba(255,255,255,.04)}
  nav.tabs button.on{background:var(--s2);color:var(--ink)}
  nav.tabs .fab{position:static;order:-1;width:100%;height:46px;border-radius:12px;margin:0 0 14px;display:flex!important;justify-content:center!important;gap:8px;font-weight:600;font-size:15px;color:#fff;box-shadow:none}
  nav.tabs .fab svg{width:20px!important;height:20px!important}
  nav.tabs .brand{order:-2}
  .hint-kb{margin-top:auto;font-size:12px;color:var(--ink3);padding:10px;line-height:1.5}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .cols.wide-l{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .cols h2:first-child{margin-top:0}
  .top h1{font-size:32px}
  .top{margin-bottom:20px}
  .row:hover,.legend .row:hover{background:rgba(255,255,255,.03)}
  .backdrop{background:rgba(0,0,0,.6)}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;max-height:86vh;border-radius:24px;padding:10px 26px 26px;transform:translate(-50%,-46%);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{visibility:hidden;margin-bottom:4px}
  .toast{left:calc(50% + 120px);bottom:32px}
  .stats{margin-bottom:0}
  .chart svg{max-height:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs"><div class="in">
  <div class="brand desk">Finanças</div>
  <button data-act="tab" data-id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-act="tab" data-id="dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Dia</button>
  <button data-act="tab" data-id="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Agenda</button>
  <button class="fab" data-act="novo" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="desk">Novo lançamento</span></button>
  <button data-act="tab" data-id="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumo</button>
  <button data-act="tab" data-id="faturas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Faturas</button>
  <button class="desk" data-act="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Buscar</button>
  <button class="desk" data-act="tab" data-id="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
  <div class="desk hint-kb">Atalhos: <b>N</b> novo, <b>/</b> buscar, <b>Esc</b> fechar</div>
</div></nav>

<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const KEY = 'financas.v1';

const CATS_G = [
  { id: 'alim',   nome: 'Alimentação',          cor: '#d95926' },
  { id: 'transp', nome: 'Transporte',           cor: '#3987e5' },
  { id: 'lazer',  nome: 'Lazer',                cor: '#d55181' },
  { id: 'casa',   nome: 'Casa',                 cor: '#c98500' },
  { id: 'saude',  nome: 'Saúde',                cor: '#199e70' },
  { id: 'edu',    nome: 'Educação',             cor: '#9085e9' },
  { id: 'parc',   nome: 'Parcelas/Assinaturas', cor: '#e66767' },
  { id: 'outros', nome: 'Outros',               cor: '#7d89a3' },
];
const CATS_E = [
  { id: 'salario', nome: 'Salário' },
  { id: 'estagio', nome: 'Estágio' },
  { id: 'pixrec',  nome: 'Pix recebido' },
  { id: 'reemb',   nome: 'Reembolso' },
  { id: 'outrase', nome: 'Outros' },
].map(c => ({ ...c, cor: '#46D39A' }));
const PAGS_FIXOS = [
  { id: 'pix', nome: 'Pix' },
  { id: 'debito', nome: 'Débito' },
  { id: 'dinheiro', nome: 'Dinheiro' },
];
const CARDS_PADRAO = []; // cadastre seus cartões em Ajustes
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => brl.format(Math.round((v || 0) * 100) / 100);
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const parseTags = t => [...new Set(String(t || '').split(/[,;\s]+/).map(x => norm(x.replace(/^#+/, '')).replace(/[^a-z0-9_-]/g, '')).filter(Boolean))];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function nowStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const todayStr = () => nowStr().slice(0, 10);
const ymNow = () => nowStr().slice(0, 7);
function addM(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
function addD(ds, n) { const [y, m, d] = ds.split('-').map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function dim(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
const dateIn = (ym, day) => `${ym}-${pad(Math.min(day, dim(ym)))}`;
const nomeMes = ym => `${MESES[+ym.slice(5, 7) - 1]} de ${ym.slice(0, 4)}`;
const mesSo = ym => MESES[+ym.slice(5, 7) - 1];
const dm = ds => `${ds.slice(8, 10)}/${ds.slice(5, 7)}`;
function nomeDia(ds) {
  if (ds === todayStr()) return 'Hoje';
  if (ds === addD(todayStr(), -1)) return 'Ontem';
  const [y, m, d] = ds.split('-').map(Number);
  return `${SEMANA[new Date(y, m - 1, d).getDay()]}, ${d} de ${MESES[m - 1]}`;
}

/* =========================================================
   DADOS (ficam só neste aparelho)
   ========================================================= */
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  normalizar(); tirarFoto();
}
function normalizar() {
  if (!S || typeof S !== 'object') S = {};
  S.v = 1;
  S.del ??= {};
  S.confU ??= 0;
  S.saldoInicial ??= null;
  S.dataInicial ??= null;
  S.cards ??= structuredClone(CARDS_PADRAO);
  S.lanc ??= [];
  S.recs ??= [];
  S.pags ??= [];
  S.metas ??= [];
  S.ultimoBackup ??= null;
  S.ocultar ??= false;
  S.receber ??= [];
  S.agenda ??= [];
  S.subs ??= [];
  S.prefs ??= [{ id: 'notif', resumo: true, agenda: true }];
  S.cats ??= { gasto: CATS_G.map(c => ({ ...c, subs: [] })), entrada: CATS_E.map(c => ({ ...c, subs: [] })) };
}
function persistir() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Não consegui salvar. Faça um backup em Ajustes.'); }
}
function save() { carimbar(); persistir(); agendarSync(); }

/* ---------- carimbos de alteração (para a sincronização saber o que é mais novo) ---------- */
const COLS = ['lanc', 'recs', 'pags', 'metas', 'receber', 'cards', 'agenda', 'subs', 'prefs'];
function itensSync(st) {
  const out = [];
  for (const c of COLS) for (const it of st[c] || []) out.push([c + ':' + it.id, it]);
  for (const t of ['gasto', 'entrada']) for (const it of (st.cats && st.cats[t]) || []) out.push(['cat' + t + ':' + it.id, it]);
  return out;
}
const semU = o => { const { u, ...r } = o; return JSON.stringify(r); };
let SNAP = new Map(), CONF = '';
function tirarFoto() { SNAP = new Map(itensSync(S).map(([k, o]) => [k, semU(o)])); CONF = JSON.stringify([S.saldoInicial, S.dataInicial]); }
function carimbar() {
  const agora = Date.now(), vistos = new Set();
  for (const [k, o] of itensSync(S)) { vistos.add(k); if (SNAP.get(k) !== semU(o)) o.u = agora; if (S.del[k] && S.del[k] <= (o.u || 0)) delete S.del[k]; }
  for (const k of SNAP.keys()) if (!vistos.has(k)) S.del[k] = agora;
  if (JSON.stringify([S.saldoInicial, S.dataInicial]) !== CONF) S.confU = agora;
  const limite = agora - 180 * 864e5; for (const k in S.del) if (S.del[k] < limite) delete S.del[k];
  tirarFoto();
}

const card = id => S.cards.find(c => c.id === id);
const isCredito = l => l.tipo === 'gasto' && !!card(l.pag);
const isPai = l => isCredito(l) && !card(l.pag).afeta;
const catsDe = tipo => tipo === 'entrada' ? S.cats.entrada : S.cats.gasto;
const catOf = l => catsDe(l.tipo).find(c => c.id === l.cat) || { id: l.cat, nome: 'Outros', cor: '#7d89a3', subs: [] };
const subOf = l => l.sub ? (catOf(l).subs || []).find(x => x.id === l.sub) : null;
const catNome = l => { const s = subOf(l); return catOf(l).nome + (s ? ' › ' + s.nome : ''); };
const CORES = ['#d95926', '#3987e5', '#d55181', '#c98500', '#199e70', '#9085e9', '#e66767', '#0ca30c', '#46b4c8', '#7d89a3'];
// valor que conta nos resumos: só a sua parte de um gasto dividido; reembolsos não contam como entrada
const valRel = l => l.tipo === 'gasto' ? (l.minha ?? l.valor) : (l.reemb ? 0 : l.valor);
const pagNome = id => (PAGS_FIXOS.find(p => p.id === id) || card(id) || { nome: '' }).nome;

/* ---------- faturas ---------- */
// Fatura é identificada pelo mês de vencimento ("2026-12").
// Compra no dia do fechamento ou depois vai para a fatura seguinte.
function refF(data, c) {
  const y = +data.slice(0, 4), m = +data.slice(5, 7), d = +data.slice(8, 10);
  let ref = `${y}-${pad(m)}`;
  if (d >= c.fecha) ref = addM(ref, 1);   // mês em que fecha
  if (c.vence <= c.fecha) ref = addM(ref, 1); // vence no mês seguinte ao fechamento
  return ref;
}
const fechamento = (c, ref) => dateIn(c.vence > c.fecha ? ref : addM(ref, -1), c.fecha);
const vencimento = (c, ref) => dateIn(ref, c.vence);
const refAtual = c => refF(nowStr(), c);
const itensFatura = (cid, ref) => S.lanc.filter(l => l.tipo === 'gasto' && l.pag === cid && refF(l.data, card(cid)) === ref).sort((a, b) => b.data.localeCompare(a.data));
const totalFatura = (cid, ref) => itensFatura(cid, ref).reduce((a, l) => a + l.valor, 0);
const pagoF = (cid, ref) => S.pags.find(p => p.card === cid && p.ref === ref);
function statusF(c, ref) { if (pagoF(c.id, ref)) return 'paga'; const h = todayStr(); if (!c.afeta) return h >= fechamento(c, ref) ? 'fechada' : 'aberta'; if (h > vencimento(c, ref)) return 'vencida'; return h >= fechamento(c, ref) ? 'fechada' : 'aberta'; }
function refsCard(cid) {
  const c = card(cid), now = nowStr(), set = new Set();
  for (const l of S.lanc) if (l.tipo === 'gasto' && l.pag === cid && l.data <= now) set.add(refF(l.data, c));
  return [...set].sort();
}
const pendentes = cid => refsCard(cid).filter(r => !pagoF(cid, r));

/* ---------- saldo ---------- */
function saldo(ate) {
  if (S.saldoInicial == null) return null;
  const di = S.dataInicial, now = ate || nowStr();
  let s = S.saldoInicial;
  for (const l of S.lanc) {
    if (l.data < di || l.data > now) continue;
    if (l.tipo === 'entrada') s += l.valor;
    else if (!card(l.pag)) s -= l.valor; // Pix, débito, dinheiro saem na hora
  }
  for (const p of S.pags) if (p.data >= di && p.data <= now) s -= p.valor; // fatura paga sai do saldo
  return s;
}
function totalPendente() {
  let t = 0;
  for (const c of S.cards) if (c.afeta) for (const r of pendentes(c.id)) t += totalFatura(c.id, r);
  return t;
}

/* ---------- totais (Cartão pai fica de fora) ---------- */
const soma = (prefix, tipo) => S.lanc.filter(l => l.tipo === tipo && !isPai(l) && l.data.startsWith(prefix)).reduce((a, l) => a + valRel(l), 0);

/* ---------- recorrentes (parcelas, assinaturas, salário) ---------- */
const occ = (r, k) => `${dateIn(addM(r.inicio, k), r.dia)}T${r.hora || '12:00'}`;
function gerar() {
  const now = nowStr(); let mudou = false;
  for (const r of S.recs) {
    if (r.fim) continue;
    while (r.total == null || r.gerados < r.total) {
      const d = occ(r, r.gerados);
      if (d > now) break;
      const k = r.gerados, idG = `${r.id}-${k}`;
      r.gerados++; mudou = true;
      if (S.lanc.some(l => l.id === idG) || S.del['lanc:' + idG]) continue;
      S.lanc.push({ id: idG, tipo: r.tipo, valor: r.valor, cat: r.cat, pag: r.pag, data: d,
        desc: r.total ? `${r.desc} (${k + 1}/${r.total})` : r.desc, rec: r.id, ...(r.sub ? { sub: r.sub } : {}), ...(r.tags && r.tags.length ? { tags: r.tags } : {}) });
    }
  }
  if (mudou) save();
}
// Quanto cada fatura futura já tem comprometido (lançado + previsto)
function previsto(c, ref) {
  let t = totalFatura(c.id, ref);
  for (const r of S.recs) {
    if (r.fim || r.tipo !== 'gasto' || r.pag !== c.id) continue;
    for (let k = r.gerados; r.total == null || k < r.total; k++) {
      const rf = refF(occ(r, k), c);
      if (rf > ref) break;
      if (rf === ref) t += r.valor;
    }
  }
  return t;
}

/* =========================================================
   INTERFACE
   ========================================================= */
const ui = { ordem: 'data', catTipo: 'gasto', selSaldo: null, cA: addM(ymNow(), -1), cB: ymNow(), bq: '', bPer: 'mes', bTipo: 'todos', bCat: null, bPag: null, voltar: 'home', tab: 'home', dia: todayStr(), mes: ymNow(), ano: +ymNow().slice(0, 4), modo: 'mes', selCat: null, selBar: null, abertaF: null };

function render() {
  gerar();
  document.querySelectorAll('nav.tabs [data-act=tab]').forEach(b => b.classList.toggle('on', b.dataset.id === ui.tab || (b.dataset.id === 'ajustes' && (ui.tab === 'cats' || ui.tab === 'receber'))));
  document.querySelectorAll('nav.tabs [data-act=buscar]').forEach(b => b.classList.toggle('on', ui.tab === 'busca'));
  const fl = $('.fab .desk'); if (fl) fl.textContent = ui.tab === 'agenda' ? 'Novo na agenda' : 'Novo lançamento';
  $('.fab').setAttribute('aria-label', ui.tab === 'agenda' ? 'Novo na agenda' : 'Novo lançamento');
  $('#view').innerHTML = ({ home: vHome, dia: vDia, resumo: vResumo, faturas: vFaturas, ajustes: vAjustes, busca: vBusca, receber: vReceber, cats: vCats, agenda: vAgenda })[ui.tab]();
  // diminui a fonte dos números que não cabem no quadrinho
  document.querySelectorAll('.stat .num').forEach(el => { let f = 17; while (el.scrollWidth > el.clientWidth && f > 11) el.style.fontSize = (--f) + 'px'; });
}

function rowL(l, opts = {}) {
  const c = catOf(l), pai = isPai(l);
  const sinal = l.tipo === 'entrada' ? '+' : '−';
  const quando = opts.comData ? `${dm(l.data)} ${l.data.slice(11)}` : l.data.slice(11);
  return `<button class="row ${pai ? 'muted' : ''}" data-act="editL" data-id="${l.id}">
    <span class="dot" style="background:${c.cor}"></span>
    <span class="rmain"><span class="rt">${esc(l.desc || c.nome)}</span>
      <span class="rs"><span>${esc(catNome(l))}</span>${l.tipo === 'gasto' ? `<span>${esc(pagNome(l.pag))}</span>` : ''}<span>${quando}</span>${pai ? '<span class="tag">não conta</span>' : ''}${l.minha != null ? `<span class="tag">sua parte ${fmt(l.minha)}</span>` : ''}${l.reemb ? '<span class="tag">reembolso</span>' : ''}${(l.tags || []).map(t => `<span class="ttag">#${esc(t)}</span>`).join('')}</span></span>
    <span class="rv ${l.tipo} ${pai ? 'muted' : ''}">${sinal} ${fmt(l.valor)}</span></button>`;
}

/* ---------- Início ---------- */
function vHome() {
  const s = saldo(), pend = totalPendente();
  const hoje = todayStr(), mes = ymNow();
  let hero;
  if (s == null) {
    hero = `<div class="hero"><div class="lbl">Saldo atual</div>
      <div class="empty">Informe quanto você tem na conta hoje para o app calcular seu saldo.</div>
      <button class="cta" data-act="saldoIni">Informar saldo</button></div>`;
  } else {
    const oc = S.ocultar, esconde = v => oc ? 'R$ ••••••' : fmt(v);
    const olho = oc
      ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c5.5 0 9 7 9 7a16.6 16.6 0 0 1-3.2 4.1M6.6 6.6C4.2 8.2 3 12 3 12s3.5 7 9 7a9 9 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
      : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    hero = `<div class="hero"><button class="eye" data-act="olho" aria-label="${oc ? 'Mostrar saldo' : 'Ocultar saldo'}">${olho}</button><div class="lbl">Saldo atual</div>
      <div class="big num ${oc ? 'oculto' : ''}">${esconde(s)}</div>
      <div class="after"><span>Depois de pagar as faturas</span><span class="num">${esconde(s - pend)}</span></div></div>`;
  }
  const recentes = S.lanc.filter(l => l.data <= nowStr()).sort((a, b) => b.data.localeCompare(a.data)).slice(0, matchMedia('(min-width:900px)').matches ? 12 : 6);
  const prox = [];
  for (const c of S.cards) if (c.afeta) for (const r of pendentes(c.id)) prox.push({ c, r, v: totalFatura(c.id, r) });
  prox.sort((a, b) => vencimento(a.c, a.r).localeCompare(vencimento(b.c, b.r)));
  return `
  <div class="top"><h1>Finanças</h1><div class="topbtns"><button class="iconbtn" data-act="buscar" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button><button class="iconbtn" data-act="tab" data-id="ajustes" aria-label="Ajustes">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div></div>
  ${barraRapida('Ex.: 35 almoço pix')}
  <div class="cols wide-l"><div>
  ${hero}${avisoBackup()}
  <div class="stats">
    <div class="stat"><div class="lbl">Gasto hoje</div><div class="num">${fmt(soma(hoje, 'gasto'))}</div></div>
    <div class="stat"><div class="lbl">Gasto no mês</div><div class="num">${fmt(soma(mes, 'gasto'))}</div></div>
    <div class="stat"><div class="lbl">Entrou no mês</div><div class="num" style="color:var(--green)">${fmt(soma(mes, 'entrada'))}</div></div>
  </div>
  ${agendaHoje()}
  ${aReceberResumo()}
  ${prox.length ? `<h2>Faturas a pagar</h2><div class="list">${prox.map(p => `
    <button class="row" data-act="tab" data-id="faturas"><span class="rmain"><span class="rt">${esc(p.c.nome)}</span>
    <span class="rs"><span>vence ${dm(vencimento(p.c, p.r))}</span><span>${statusF(p.c, p.r)}</span></span></span>
    <span class="rv">${fmt(p.v)}</span></button>`).join('')}</div>` : ''}
  </div><div>
  <h2 class="ultimos">Últimos lançamentos</h2>
  ${recentes.length ? `<div class="list">${recentes.map(l => rowL(l, { comData: true })).join('')}</div>`
    : `<div class="emptybox">Nenhum lançamento ainda. Toque no + para registrar o primeiro gasto.</div>`}
  </div></div>`;
}

/* ---------- Dia ---------- */
function vDia() {
  const d = ui.dia;
  const itens = ordenar(S.lanc.filter(l => l.data.startsWith(d)));
  const g = soma(d, 'gasto'), e = soma(d, 'entrada');
  return `
  <div class="top"><h1>Dia</h1><div class="topbtns">${d !== todayStr() ? `<button class="btn sm" data-act="diaHoje">Hoje</button>` : ''}<button class="iconbtn" data-act="buscar" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button></div></div>
  <div class="cols"><div>${calendario(d)}</div><div>
  <h2 style="margin-top:4px">${nomeDia(d)}</h2>
  <div class="two" style="margin-bottom:12px">
    <div class="stat"><div class="lbl">Gastos</div><div class="num">${fmt(g)}</div></div>
    <div class="stat"><div class="lbl">Entradas</div><div class="num" style="color:var(--green)">${fmt(e)}</div></div>
  </div>
  ${itens.length > 1 ? seletorOrdem() : ''}
  ${itens.length ? `<div class="list">${itens.map(l => rowL(l)).join('')}</div>` : `<div class="emptybox">Nada registrado neste dia.</div>`}
  </div></div>`;
}

function diasDesde(ds) {
  const [y, m, d] = ds.slice(0, 10).split('-').map(Number);
  const [y2, m2, d2] = todayStr().split('-').map(Number);
  return Math.round((new Date(y2, m2 - 1, d2) - new Date(y, m - 1, d)) / 864e5);
}
function avisoBackup() {
  if (!S.lanc.length) return '';
  if (!S.ultimoBackup) return `<button class="warnbar" data-act="exportar"><span>Você ainda não fez nenhum backup. Toque aqui para <b>exportar agora</b>.</span></button>`;
  const d = diasDesde(S.ultimoBackup);

/* ---------- Gráficos extras ---------- */
function graficoSaldo(ym) {

  const ini = S.dataInicial.slice(0, 10), hoje = todayStr();
  const dias = [];
  for (let i = 1; i <= dim(ym); i++) { const d = `${ym}-${pad(i)}`; if (d >= ini && d <= hoje) dias.push(d); }
  if (dias.length < 2) return '';

  const W = 340, H = 170, L = 4, T = 14, B = H - 22;
  let mn = Math.min(...v), mx = Math.max(...v); if (mx - mn < 1) { mx += 1; mn -= 1; }
  const pad_ = (mx - mn) * .1; mn -= pad_; mx += pad_;

  const pts = dias.map((d, i) => `${x(d).toFixed(1)},${y(v[i]).toFixed(1)}`).join(' ');
  const sel = ui.selSaldo != null && ui.selSaldo < dias.length ? ui.selSaldo : dias.length - 1;
  let out = `<line x1="0" x2="${W}" y1="${B}" y2="${B}" stroke="#22355C"/>`;
  if (mn < 0 && mx > 0) out += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#FF8080" stroke-dasharray="3 4" opacity=".5"/>`;
  out += `<polyline points="${pts}" fill="none" stroke="#86A8FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  out += `<line x1="${x(dias[sel])}" x2="${x(dias[sel])}" y1="${T}" y2="${B}" stroke="#6F7FA0" stroke-dasharray="2 3"/>`;
  out += `<circle cx="${x(dias[sel])}" cy="${y(v[sel])}" r="5" fill="#86A8FF" stroke="#0F1B30" stroke-width="2"/>`;
  [1, Math.ceil(n / 2), n].forEach(d => out += `<text x="${x(`${ym}-${pad(d)}`)}" y="${H - 6}" text-anchor="${d === 1 ? 'start' : d === n ? 'end' : 'middle'}" fill="#6F7FA0" font-size="11">${d}</text>`);
  const cw = (W - 2 * L) / (n - 1);
  dias.forEach((d, i) => out += `<rect x="${x(d) - cw / 2}" y="0" width="${cw}" height="${H}" fill="transparent" data-act="selSaldo" data-id="${i}"/>`);
  return `<h2>Saldo no mês</h2><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo ao fim de cada dia">${out}</svg>
    <div class="cap">dia ${+dias[sel].slice(8, 10)}: <b class="num">${fmt(v[sel])}</b></div></div>`;
}
function porSemana(prefix) {

/* ---------- Metas ---------- */
const sobraMes = ym => soma(ym, 'entrada') - soma(ym, 'gasto');
function progressoMeta(m) {
  let t = m.ja || 0;
  const fim = ymNow() < m.prazo ? ymNow() : m.prazo;
  for (let ym = m.inicio; ym <= fim; ym = addM(ym, 1)) t += sobraMes(ym);
  return Math.max(0, t);
}
function mesesEntre(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function vMetas() {
  const cards = S.metas.map(m => {
    const p = progressoMeta(m), pct = Math.min(100, Math.round(p / m.alvo * 100)), falta = m.alvo - p;
    const restam = mesesEntre(ymNow(), m.prazo) + 1;
    let txt;
    if (falta <= 0) txt = 'Meta atingida.';
    else if (restam <= 0) txt = `O prazo acabou e faltaram ${fmt(falta)}.`;
    else txt = `Faltam ${fmt(falta)}. Guardando ${fmt(falta / restam)} por mês, você chega lá em ${mesSo(m.prazo)}${m.prazo.slice(0, 4) !== ymNow().slice(0, 4) ? ' de ' + m.prazo.slice(0, 4) : ''}.`;
    return `<button class="meta" data-act="editMeta" data-id="${m.id}">
      <div class="mtop"><b>${esc(m.nome)}</b><span class="sub">até ${mesSo(m.prazo)} ${m.prazo.slice(0, 4)}</span></div>
      <div class="mval num">${fmt(p)} <small>de ${fmt(m.alvo)}</small></div>
      <div class="gauge ${falta <= 0 ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
      <div class="sub" style="color:var(--ink2)">${pct}%. ${txt}</div></button>`;
  }).join('');
  return `${cards || `<div class="emptybox">Nenhuma meta ainda. Crie uma para acompanhar quanto falta para juntar um valor.</div>`}
  <div style="margin-top:4px"><button class="btn full" data-act="editMeta" data-id="">Nova meta</button></div>
  <p class="sub" style="margin:14px 2px 0">O progresso soma o que sobrou em cada mês (entradas menos gastos) desde o início da meta. Se tiver mais de uma meta, todas usam a mesma sobra.</p>`;
}

/* ---------- Resumo ---------- */
function arc(cx, cy, R, r, s, e) {
  const large = e - s > Math.PI ? 1 : 0, P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
  return `M${P(R, s)}A${R} ${R} 0 ${large} 1 ${P(R, e)}L${P(r, e)}A${r} ${r} 0 ${large} 0 ${P(r, s)}Z`;
}
function donut(itens, total) {
  const cx = 110, cy = 110, R = 100, r = 68;

  const gap = itens.length > 1 ? 0.03 : 0;
  for (const it of itens) {
    const a1 = a0 + it.v / total * Math.PI * 2;
    const op = ui.selCat && ui.selCat !== it.id ? .3 : 1;
    if (itens.length === 1) out += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${it.cor}" stroke-width="${R - r}" data-act="selCat" data-id="${it.id}"/>`;
    else if (a1 - a0 > gap) out += `<path d="${arc(cx, cy, R, r, a0 + gap / 2, a1 - gap / 2)}" fill="${it.cor}" opacity="${op}" data-act="selCat" data-id="${it.id}"/>`;
    a0 = a1;
  }
  const sel = itens.find(i => i.id === ui.selCat);
  const t1 = sel ? sel.nome : 'Gastos', t2 = fmt(sel ? sel.v : total);
  return `<svg viewBox="0 0 220 220" style="max-width:240px;margin:0 auto" role="img" aria-label="Gastos por categoria">${out}
    <text pointer-events="none" x="110" y="102" text-anchor="middle" fill="#A9B6CF" font-size="13">${esc(t1.length > 18 ? t1.slice(0, 17) + '…' : t1)}</text>
    <text pointer-events="none" x="110" y="126" text-anchor="middle" fill="#EEF2FA" font-size="20" font-weight="700" style="font-family:var(--num)">${t2}</text></svg>`;
}
function barras(vals) {
  const W = 340, H = 180, top = 14, base = H - 24, cw = W / 12, bw = cw * .58;
  const max = Math.max(...vals, 1);
  let out = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#22355C"/>`;
  vals.forEach((v, i) => {
    const h = v / max * (base - top), x = i * cw + (cw - bw) / 2, y = base - h;
    const rr = Math.min(4, h / 2, bw / 2);
    const op = ui.selBar != null && ui.selBar !== i ? .35 : 1;
    if (h > 0) out += `<path d="M${x} ${base}V${y + rr}Q${x} ${y} ${x + rr} ${y}H${x + bw - rr}Q${x + bw} ${y} ${x + bw} ${y + rr}V${base}Z" fill="#3987e5" opacity="${op}"/>`;
    out += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="${ui.selBar === i ? '#EEF2FA' : '#6F7FA0'}" font-size="11">${MES_CURTO[i]}</text>`;
    out += `<rect x="${i * cw}" y="0" width="${cw}" height="${H}" fill="transparent" data-act="selBar" data-id="${i}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por mês">${out}</svg>`;
}
function porCategoria(prefix) {
  const m = new Map();
  for (const l of S.lanc) if (l.tipo === 'gasto' && !isPai(l) && l.data.startsWith(prefix)) m.set(l.cat, (m.get(l.cat) || 0) + valRel(l));
  return S.cats.gasto.filter(c => m.get(c.id) > 0).map(c => ({ ...c, v: m.get(c.id) })).sort((a, b) => b.v - a.v);
}
function legenda(itens, total) {
  return `<div class="legend">${itens.map(i => `<button class="row" data-act="selCat" data-id="${i.id}">
    <span class="dot" style="background:${i.cor}"></span><span class="rmain"><span class="rt">${esc(i.nome)}</span></span>
    <span class="pct">${Math.round(i.v / total * 100)}%</span><span class="rv">${fmt(i.v)}</span></button>`).join('')}</div>`;
}
// gastos e entradas recorrentes que ainda vão cair neste mês (depois de agora)
function futuroMes(ym) {
  const now = nowStr(); let g = 0, e = 0;
  for (const r of S.recs) {
    if (r.fim) continue;
    if (r.tipo === 'gasto' && card(r.pag) && !card(r.pag).afeta) continue;
    for (let k = r.gerados; r.total == null || k < r.total; k++) {
      const d = occ(r, k); if (d.slice(0, 7) > ym) break;
      if (d > now && d.startsWith(ym)) { if (r.tipo === 'gasto') g += r.valor; else e += r.valor; }
    }
  }
  return { g, e };
}
function vResumo() {
  const seg = `<div class="seg"><button class="${ui.modo === 'mes' ? 'on' : ''}" data-act="modo" data-id="mes">Mês</button><button class="${ui.modo === 'ano' ? 'on' : ''}" data-act="modo" data-id="ano">Ano</button><button class="${ui.modo === 'comparar' ? 'on' : ''}" data-act="modo" data-id="comparar">Comparar</button><button class="${ui.modo === 'metas' ? 'on' : ''}" data-act="modo" data-id="metas">Metas</button></div>`;
  if (ui.modo === 'comparar') return `<div class="top"><h1>Resumo</h1></div>${seg}${vComparar()}`;
  if (ui.modo === 'metas') return `<div class="top"><h1>Resumo</h1></div>${seg}${vMetas()}`;
  if (ui.modo === 'mes') {
    const m = ui.mes, g = soma(m, 'gasto'), e = soma(m, 'entrada'), ant = soma(addM(m, -1), 'gasto');
    let cmp = '';
    if (ant > 0 && g > 0) {
      const p = Math.round((g - ant) / ant * 100);
      cmp = `<div class="cmp">${p === 0 ? 'Mesmo gasto' : `${Math.abs(p)}% ${p > 0 ? 'a mais' : 'a menos'}`} que em ${mesSo(addM(m, -1))}${m === ymNow() ? ' (mês ainda em andamento)' : ''}.</div>`;
    }
    const cats = porCategoria(m);
    const atual = m === ymNow(), diasMes = dim(m), hojeDia = +todayStr().slice(8, 10);
    const diasCorridos = atual ? hojeDia : (m < ymNow() ? diasMes : 0);
    let diario = '';
    if (diasCorridos > 0) {
      const media = g / diasCorridos;
      let pode = '';
      if (atual) {
        const fut = futuroMes(m), restam = diasMes - hojeDia + 1;
        const livre = e + fut.e - g - fut.g;
        pode = `<div class="stat"><div class="lbl">Pode gastar por dia</div><div class="num" style="color:${livre > 0 ? 'var(--gold)' : 'var(--red)'}">${livre > 0 ? fmt(livre / restam) : fmt(0)}</div></div>`;
      }
      diario = `<div class="${pode ? 'two' : ''}" style="margin-bottom:12px">
        <div class="stat"><div class="lbl">Média por dia</div><div class="num">${fmt(media)}</div></div>${pode}</div>
        ${atual ? `<p class="sub" style="margin:-4px 2px 12px">"Pode gastar por dia" divide o que ainda sobra do mês (já contando parcelas e entradas fixas que faltam cair) pelos ${diasMes - hojeDia + 1} dias restantes, incluindo hoje.</p>` : ''}`;
    }
    const top5 = S.lanc.filter(l => l.tipo === 'gasto' && !isPai(l) && l.data.startsWith(m)).sort((a, b) => valRel(b) - valRel(a)).slice(0, 5);
    return `<div class="top"><h1>Resumo</h1></div>${seg}
    <div class="pnav"><button data-act="mesMv" data-id="-1" aria-label="Mês anterior">‹</button><span class="pl">${nomeMes(m)}</span><button data-act="mesMv" data-id="1" aria-label="Próximo mês">›</button></div>
    <div class="trio">
      <div class="stat"><div class="lbl">Entradas</div><div class="num" style="color:var(--green)">${fmt(e)}</div></div>
      <div class="stat"><div class="lbl">Gastos</div><div class="num">${fmt(g)}</div></div>
      <div class="stat"><div class="lbl">Sobrou</div><div class="num" style="color:${e - g >= 0 ? 'var(--gold)' : 'var(--red)'}">${fmt(e - g)}</div></div>
    </div>${cmp}
    <div class="cols"><div>${diario}
    ${cats.length ? `<div class="chart">${donut(cats, g)}${legenda(cats, g)}${ui.selCat ? subsDe(m, ui.selCat) : ''}</div>` : `<div class="emptybox">Sem gastos neste mês.</div>`}
    </div><div>
    ${graficoSaldo(m)}
    ${top5.length ? `<h2>Maiores gastos</h2><div class="list">${top5.map(l => rowL(l, { comData: true })).join('')}</div>` : ''}
    ${porSemana(m)}
    </div></div>`;
  }
  const y = ui.ano, vals = [...Array(12)].map((_, i) => soma(`${y}-${pad(i + 1)}`, 'gasto'));
  const g = vals.reduce((a, b) => a + b, 0), e = soma(String(y), 'entrada');
  const cats = porCategoria(String(y));
  const cap = ui.selBar != null ? `${MESES[ui.selBar]}: <b class="num">${fmt(vals[ui.selBar])}</b>` : 'Toque numa barra para ver o valor';
  return `<div class="top"><h1>Resumo</h1></div>${seg}
  <div class="pnav"><button data-act="anoMv" data-id="-1" aria-label="Ano anterior">‹</button><span class="pl">${y}</span><button data-act="anoMv" data-id="1" aria-label="Próximo ano">›</button></div>
  <div class="trio">
    <div class="stat"><div class="lbl">Entradas</div><div class="num" style="color:var(--green)">${fmt(e)}</div></div>
    <div class="stat"><div class="lbl">Gastos</div><div class="num">${fmt(g)}</div></div>
    <div class="stat"><div class="lbl">Sobrou</div><div class="num" style="color:${e - g >= 0 ? 'var(--gold)' : 'var(--red)'}">${fmt(e - g)}</div></div>
  </div>
  <div class="cols"><div>
  <div class="chart">${barras(vals)}<div class="cap">${cap}</div></div>
  ${porSemana(String(y))}
  </div><div>
  ${cats.length ? `<h2>Por categoria</h2><div class="chart">${legenda(cats, g)}${ui.selCat ? subsDe(String(y), ui.selCat) : ''}</div>` : ''}
  </div></div>`;
}

/* =========================================================
   FOLHAS (formulários)

function openSheet(html, onMount) {
  const aberta = $('.sheet.show');
  if (aberta) { // já está aberta: só troca o conteúdo, sem animar de novo
    const y = aberta.scrollTop; aberta.querySelector('.in').innerHTML = html; aberta.scrollTop = y;
    onMount && onMount(aberta); return;
  }
  $('#layer').innerHTML = `<div class="backdrop" data-act="fechar"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="in">${html}</div></div>`;
  requestAnimationFrame(() => { $('.backdrop').classList.add('show'); $('.sheet').classList.add('show'); });
  onMount && onMount($('.sheet'));
}
function closeSheet() {
  const b = $('.backdrop'), s = $('.sheet'); if (!s) return;
  b.classList.remove('show'); s.classList.remove('show');
  setTimeout(() => { $('#layer').innerHTML = ''; }, 260);
}
function moneyInput(el, valor) {
  const set = c => { el.dataset.cents = c; el.value = c ? fmt(c / 100) : ''; };
  set(Math.round((valor || 0) * 100));
  el.addEventListener('input', () => set(parseInt(el.value.replace(/\D/g, '') || '0', 10)));
}
const centsOf = el => (+el.dataset.cents || 0) / 100;
function chips(list, sel, act) {
  return `<div class="chips">${list.map(i => `<button type="button" class="chip ${i.id === sel ? 'on' : ''}" data-act="${act}" data-id="${i.id}">${i.cor ? `<span class="dot" style="background:${i.cor}"></span>` : ''}${esc(i.nome)}</button>`).join('')}</div>`;
}

/* ---------- novo / editar lançamento ---------- */
let F = null;
function formL(l) {
  const novo = !l;
  F = l ? { ...l, tagsTxt: (l.tags || []).join(', ') } : { tipo: 'gasto', valor: 0, cat: 'alim', sub: null, pag: 'pix', data: nowStr(), desc: '', tagsTxt: '', parcelas: 1, repetir: false, dividir: false, nDiv: 2, nomesTxt: '' };
  F.novo = novo;
  drawFormL();
}
function drawFormL() {
  const pags = [...PAGS_FIXOS, ...S.cards];
  const cred = F.tipo === 'gasto' && !!card(F.pag);
  const cats = catsDe(F.tipo).filter(c => !c.oculta || c.id === F.cat);
  if (!cats.find(c => c.id === F.cat)) F.cat = cats[0].id;
  const subs = catOf(F).subs || [];
  if (F.sub && !subs.find(x => x.id === F.sub)) F.sub = null;
  const podeDividir = F.tipo === 'gasto' && F.novo && !(cred && F.parcelas > 1) && !F.repetir;
  const v = F._el ? centsOf(F._el) : F.valor;
  openSheet(`
    <h3>${F.novo ? 'Novo lançamento' : 'Editar lançamento'}<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    <div class="seg"><button type="button" class="${F.tipo === 'gasto' ? 'on' : ''}" data-act="fTipo" data-id="gasto">Gasto</button><button type="button" class="${F.tipo === 'entrada' ? 'on' : ''}" data-act="fTipo" data-id="entrada">Entrada</button></div>
    <input class="amount ${F.tipo}" id="fValor" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off">
    ${F.novo && cred && F.parcelas > 1 ? `<div class="hint" id="fParcHint" style="text-align:center;margin:-6px 0 12px"></div>` : ''}
    <div class="field"><span class="flabel">Categoria</span>${chips(cats, F.cat, 'fCat')}</div>
    ${subs.length ? `<div class="field"><span class="flabel">Subcategoria</span>${chips([{ id: '', nome: 'Nenhuma' }, ...subs], F.sub || '', 'fSub')}</div>` : ''}
    ${F.tipo === 'gasto' ? `<div class="field"><span class="flabel">Forma de pagamento</span>${chips(pags, F.pag, 'fPag')}</div>` : ''}
    ${F.novo && cred ? `<div class="field"><span class="flabel">Parcelas</span><div class="stepper"><button type="button" data-act="fParc" data-id="-1">−</button><span class="num">${F.parcelas}x</span><button type="button" data-act="fParc" data-id="1">+</button></div></div>` : ''}
    ${F.novo && !(cred && F.parcelas > 1) && !F.dividir ? `<div class="field switch"><span>Repetir todo mês</span><input type="checkbox" id="fRep" ${F.repetir ? 'checked' : ''}></div>` : ''}
    ${podeDividir ? `<div class="field switch"><span>Dividir com outras pessoas</span><input type="checkbox" id="fDiv" ${F.dividir ? 'checked' : ''}></div>` : ''}
    ${podeDividir && F.dividir ? `<div class="split"><span class="flabel">Dividido entre quantas pessoas (contando você)</span>
      <div class="stepper" style="margin-bottom:10px"><button type="button" data-act="fNDiv" data-id="-1">−</button><span class="num">${F.nDiv}</span><button type="button" data-act="fNDiv" data-id="1">+</button></div>
      <label class="flabel" for="fNomes">Quem te deve (opcional, separe por vírgula)</label><input id="fNomes" value="${esc(F.nomesTxt || '')}" placeholder="Ex.: João, Ana">
      <div class="hint" id="fDivHint"></div></div>` : ''}
    ${!F.novo && F.minha != null ? `<p class="hint" style="margin:-4px 2px 12px">Gasto dividido: sua parte é ${fmt(F.minha)}. O resto está em Contas a receber.</p>` : ''}
    <div class="field"><label for="fDesc">Descrição (opcional)</label><input id="fDesc" value="${esc(F.desc)}" placeholder="${F.tipo === 'gasto' ? 'Ex.: almoço' : 'Ex.: salário de novembro'}"></div>
    <div class="field"><label for="fTags">Tags (opcional)</label><input id="fTags" value="${esc(F.tagsTxt)}" placeholder="Ex.: viagem-rio, aniversario" autocapitalize="off"></div>

    const hDiv = () => { const h = sh.querySelector('#fDivHint'); if (h) { const v = centsOf(el), per = Math.round(v / F.nDiv * 100) / 100; h.textContent = `Sua parte: ${fmt(v - per * (F.nDiv - 1))}. Cada um te deve ${fmt(per)}.`; } };
    el.addEventListener('input', hint); el.addEventListener('input', hDiv); hint(); hDiv();
    if (F.novo && !v && !F._focou) { F._focou = true; setTimeout(() => el.focus(), 300); }
  });

function lerFormL() {
  F.valor = centsOf(F._el);

  const rep = $('#fRep'); if (rep) F.repetir = rep.checked;
  const dv = $('#fDiv'); if (dv) F.dividir = dv.checked;
  const nm = $('#fNomes'); if (nm) F.nomesTxt = nm.value;
}
function salvarL() {
  lerFormL();
  if (!(F.valor > 0)) { toast('Digite um valor'); return; }
  const pag = F.tipo === 'gasto' ? F.pag : null;

const VAPID_PUB = 'BOyEVqV-CpRG9EPJ8v5ztO2SIZLvh2jnF3mk7hZrt515v3u_tRjsx_3dKdvjdHrrmeuvWwZ-dLd8wTIt1Gg79vs';

const b64uDec = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(t + '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0)); };

async function inscrever(pedir) {

    mudou = true;

// Criptografia Web Push (RFC 8291, aes128gcm): o aparelho lacra a mensagem para cada aparelho inscrito
async function selar(sub, msg) {

  const uaKey = await crypto.subtle.importKey('raw', ua, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
  const ecdh = new Uint8Array(await crypto.subtle.deriveBits({ name: 'ECDH', public: uaKey }, kp.privateKey, 256));
  const um = new Uint8Array([1]);
  const ikm = await hmac(await hmac(auth, ecdh), cat(enc.encode('WebPush: info\0'), ua, asPub, um));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const prk = await hmac(salt, ikm);
  const cek = (await hmac(prk, cat(enc.encode('Content-Encoding: aes128gcm\0'), um))).slice(0, 16);
  const nonce = (await hmac(prk, cat(enc.encode('Content-Encoding: nonce\0'), um))).slice(0, 12);
  const pt = cat(enc.encode(JSON.stringify(msg)), new Uint8Array([2]));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce }, await crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['encrypt']), pt));
  const hdr = new Uint8Array(86); hdr.set(salt, 0); new DataView(hdr.buffer).setUint32(16, 4096); hdr[20] = 65; hdr.set(asPub, 21);
  return b64(cat(hdr, ct));
}
function resumoDia(d) {
  const gs = S.lanc.filter(l => l.tipo === 'gasto' && !isPai(l) && l.data.startsWith(d));
  if (!gs.length) return { title: 'Resumo do dia', body: 'Nenhum gasto registrado hoje. Esqueceu de lançar algo?', tag: 'resumo', url: './?ir=dia' };
  const t = gs.reduce((a, l) => a + valRel(l), 0), m = gs.reduce((a, l) => valRel(l) > valRel(a) ? l : a);
  return { title: 'Resumo do dia', body: `Hoje você gastou ${fmt(t)}. Maior gasto: ${m.desc || catNome(m)}, ${fmt(valRel(m))}.`, tag: 'resumo', url: './?ir=dia' };
}
function textoAviso(aviso, hora) {
  if (aviso === 0) return `Começa agora, ${hora}`;
  if (aviso === 1440) return `Amanhã às ${hora}`;
  if (aviso === 60) return `Em 1 hora, às ${hora}`;
  return `Em ${aviso} minutos, às ${hora}`;
}
function filaPlana() {
  const out = [], pr = prefN(), agora = Date.now(), hoje = todayStr(), fim = addD(hoje, 14);
  if (pr.resumo) for (let i = 0; i <= 14; i++) {
    const d = addD(hoje, i), at = new Date(`${d}T20:00`).getTime();
    if (at >= agora - 60e3) out.push({ k: 'r-' + d, at, msg: resumoDia(d) });
  }
  if (pr.agenda) for (const it of S.agenda) {
    if (it.feito || !it.hora) continue;
    for (const d of ocorr(it, hoje, fim)) {
      const ini = new Date(`${d}T${it.hora}`).getTime();
      let at, body;
      if (it.tipo === 'evento') { if (it.aviso == null) continue; at = ini - it.aviso * 60e3; body = textoAviso(it.aviso, it.hora); }
      else { at = ini; body = 'Tarefa para agora'; }
      if (at < agora - 60e3) continue;
      out.push({ k: `a-${it.id}-${d}-${it.hora}-${it.aviso ?? 't'}`, at, msg: { title: it.titulo, body, tag: `ag-${it.id}-${d}`, url: './?ir=agenda' } });
    }

  return out.sort((a, b) => a.at - b.at);
}
let filaTimer = null;
function agendarFila(ms = 3000) { if (!SY || !syncPronto()) return; clearTimeout(filaTimer); filaTimer = setTimeout(() => enviarFila().catch(() => {}), ms); }
async function enviarFila(forcar, extra) {
  if (!SY || !syncPronto()) return;
  const plano = filaPlana(); if (extra) plano.push(...extra);
  const subs = S.subs || [];
  const assin = await hexDe(enc.encode(JSON.stringify([plano, subs.map(x => x.ep)])), 'fila');
  let ant = {}; try { ant = JSON.parse(localStorage.getItem(KEY_FILA)) || {}; } catch (e) {}
  if (!forcar && ant.h === assin && Date.now() - (ant.t || 0) < 6 * 3600e3) return;
  const items = [];
  for (const it of plano) for (const x of subs) items.push({ k: it.k + '|' + x.id, at: it.at, ep: x.ep, b: await selar(x, it.msg) });
  const r = await fetch(`${SYNC_URL}/a/${SY.id}`, { method: 'PUT', cache: 'no-store', headers: { Authorization: 'Bearer ' + SY.tok, 'Content-Type': 'application/json' }, body: JSON.stringify({ items }) });
  if (!r.ok) throw new Error('fila ' + r.status);

  localStorage.setItem(KEY_FILA, JSON.stringify({ h: assin, t: Date.now() }));
}

const SYNC_URL = 'https://caderno-sync.lc-br.workers.dev';
const KEY_SYNC = 'financas.sync';
let SY = null;
try { SY = JSON.parse(localStorage.getItem(KEY_SYNC)); } catch (e) { SY = null; }
const saveSync = () => { try { SY ? localStorage.setItem(KEY_SYNC, JSON.stringify(SY)) : localStorage.removeItem(KEY_SYNC); } catch (e) {} };
const syncPronto = () => !!SYNC_URL && !SYNC_URL.startsWith('__');
const enc = new TextEncoder(), dec = new TextDecoder();
const junta = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };

}
const chave = () => crypto.subtle.importKey('raw', unb64(SY.k), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function comprimir(u8, sim) {

async function decifrar(txt) {

// só o que deve ir para a nuvem (o olho e a data do backup ficam em cada aparelho)
const dadosSync = st => { const { ocultar, ultimoBackup, ...r } = st; return r; };
function canon(st) {
  const d = dadosSync(st), o = {};
  for (const k of Object.keys(d).sort()) {
    const v = d[k];
    if (Array.isArray(v)) o[k] = [...v].sort((a, b) => String(a.id).localeCompare(String(b.id))).map(x => JSON.stringify(x));
    else if (k === 'del') o[k] = Object.keys(v).sort().map(x => x + '=' + v[x]);

function mesclar(loc, rem) {
  const del = { ...(rem.del || {}) };
  for (const [k, t] of Object.entries(loc.del || {})) del[k] = Math.max(del[k] || 0, t);
  const escolhe = (a, b) => !a ? b : !b ? a : ((b.u || 0) > (a.u || 0) ? b : a);
  const junta2 = (pre, A, B) => {
    const m = new Map();
    for (const x of A || []) m.set(x.id, x);
    for (const x of B || []) {
      const a = m.get(x.id); let e = escolhe(a, x);
      if (pre === 'recs:' && a) e = { ...e, gerados: Math.max(a.gerados || 0, x.gerados || 0) };
      m.set(x.id, e);
    }
    return [...m.values()].filter(x => !(del[pre + x.id] !== undefined && del[pre + x.id] >= (x.u || 0)));
  };
  const out = { ...loc };
  for (const c of COLS) out[c] = junta2(c + ':', loc[c], rem[c]);
  out.cats = { gasto: junta2('catgasto:', loc.cats?.gasto, rem.cats?.gasto), entrada: junta2('catentrada:', loc.cats?.entrada, rem.cats?.entrada) };
  if ((rem.confU || 0) > (loc.confU || 0)) { out.saldoInicial = rem.saldoInicial; out.dataInicial = rem.dataInicial; out.confU = rem.confU; }
  out.del = del;

}
async function api(method, body) {
  const r = await fetch(`${SYNC_URL}/v/${SY.id}`, { method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + SY.tok, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
let syncando = false, syncDeNovo = false, syncTimer = null;
function agendarSync(ms = 2500) { if (!SY || !syncPronto()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sincronizar(), ms); }
async function sincronizar(manual) {
  if (!SY || !syncPronto()) return;
  if (syncando) { syncDeNovo = true; return; }
  syncando = true; clearTimeout(syncTimer);
  let mudouAqui = false;
  try {
    for (let t = 0; t < 4; t++) {
      const g = await api('GET');
      let base = 0, remoto = null;
      if (g.status === 200) { base = g.j.ver; remoto = await decifrar(g.j.blob); }
      else if (g.status !== 404) throw new Error('GET ' + g.status);
      if (remoto) {
        const antes = canon(S), m = mesclar(S, remoto);
        Object.assign(m, { ocultar: S.ocultar, ultimoBackup: S.ultimoBackup });
        S = m; normalizar();
        if (canon(S) !== antes) { mudouAqui = true; persistir(); tirarFoto(); }
        if (canon(S) === canon(remoto)) { SY.ver = base; break; }
      }
      const p = await api('PUT', { baseVer: base, blob: await cifrar(dadosSync(S)) });
      if (p.status === 200) { SY.ver = p.j.ver; break; }
      if (p.status !== 409) throw new Error('PUT ' + p.status);
    }
    SY.ult = nowStr(); SY.erro = null;
    agendarFila(1500);
    if (manual) toast('Sincronizado');
  } catch (e) {
    SY.erro = navigator.onLine === false ? 'sem internet' : 'não conseguiu conectar';
    if (manual) toast('Não consegui sincronizar agora');
  } finally {
    syncando = false; saveSync();
    if (mudouAqui && !$('.sheet.show')) render();
    else if (ui.tab === 'ajustes') render();
    if (syncDeNovo) { syncDeNovo = false; agendarSync(400); }
  }
}

    const it = S.agenda.find(x => x.id === id); if (!it) return;
    if (it.feito) { it.feito = false; delete it.feitoEm; save(); render(); agendarFila(800); return; }
    if (it.rep && it.rep !== 'nunca' && it.data) {
      const antes = it.data, dia = +it.data.slice(8, 10), hoje = todayStr();
      do { it.data = proxData(it.data, it.rep, dia); } while (it.data < hoje);
      save(); render(); agendarFila(800);
      toastAcao(`Próxima: ${dm(it.data)}`, 'Desfazer', () => { it.data = antes; save(); render(); agendarFila(800); });
      return;
    }
    it.feito = true; it.feitoEm = nowStr(); save(); render(); agendarFila(800);
    toastAcao('Tarefa concluída', 'Desfazer', () => { it.feito = false; delete it.feitoEm; save(); render(); agendarFila(800); });
  },
  agVerFeitas: () => { ui.verFeitas = !ui.verFeitas; render(); },
  notifAtivar: async () => {
    try {
      const ok = await inscrever(true);
      if (!ok) { toast('Permissão não concedida'); render(); return; }
      await enviarFila(true); render(); toast('Notificações ativadas');
    } catch (e) { toast('Não consegui ativar as notificações'); }
  },
  notifRemover: id => confirmar('Parar de mandar notificações para este aparelho?', 'Remover', () => { S.subs = S.subs.filter(x => x.id !== id); save(); closeSheet(); render(); enviarFila(true).catch(() => {}); }),
  notifTeste: async () => {
    try { await enviarFila(true, [{ k: 'teste-' + Date.now(), at: Date.now(), msg: { title: 'Finanças', body: 'Notificação de teste. Está funcionando!', tag: 'teste', url: './' } }]); toast('Enviada. Deve chegar em até 1 minuto.'); }
    catch (e) { toast('Não consegui enviar o teste'); }
  },
  editL: id => formL(S.lanc.find(l => l.id === id)),
  fechar: closeSheet,
  fTipo: id => { lerFormL(); F.tipo = id; drawFormL(); },
  fCat: id => { lerFormL(); if (F.cat !== id) F.sub = null; F.cat = id; drawFormL(); },
  fSub: id => { lerFormL(); F.sub = id || null; drawFormL(); },
  fNDiv: d => { lerFormL(); F.nDiv = Math.min(20, Math.max(2, F.nDiv + +d)); drawFormL(); },
  diaSel: d => { ui.dia = d; render(); },
  calMv: d => { const ym = addM(ui.dia.slice(0, 7), +d); ui.dia = dateIn(ym, +ui.dia.slice(8, 10)); render(); },
  selSaldo: i => { ui.selSaldo = +i; render(); },
  novaReceber: formReceber,
  salvarReceber: () => {
    const pessoa = $('#qPessoa').value.trim(), valor = centsOf($('#qValor')), desc = $('#qDesc').value.trim();
    if (!pessoa) { toast('Diga quem te deve'); return; }
    if (!(valor > 0)) { toast('Digite um valor'); return; }
    S.receber.push({ id: uid(), pessoa, valor, desc: desc || 'conta', data: nowStr() });
    save(); closeSheet(); render(); toast('Conta a receber salva');
  },
  abrirRec: id => abrirRec(id),
  receberOk: id => {
    const r = S.receber.find(x => x.id === id); if (!r) return;
    const l = { id: uid(), tipo: 'entrada', valor: r.valor, cat: 'reemb', pag: null, data: nowStr(), desc: `${r.pessoa}: ${r.desc}`, reemb: true };
    S.lanc.push(l); r.recebido = { data: l.data, lanc: l.id };
    save(); closeSheet(); render(); toast(`${fmt(r.valor)} recebido`);
  },
  desfazerRec: id => {
    const r = S.receber.find(x => x.id === id); if (!r || !r.recebido) return;
    S.lanc = S.lanc.filter(l => l.id !== r.recebido.lanc); delete r.recebido; save(); render(); toast('Recebimento desfeito');
  },
  excluirReceber: id => confirmar('Excluir esta conta a receber?', 'Excluir', () => { S.receber = S.receber.filter(x => x.id !== id); save(); closeSheet(); render(); }),
  cobrar: id => cobrar(id),
  catTipo: t => { ui.catTipo = t; render(); },
  ordem: o => { ui.ordem = o; render(); },
  abrirSync: () => { SV = { modo: 'novo' }; formSync(); },
  svModo: m => { SV.modo = m; formSync(); },
  svAtivar: () => ativarSync(),
  syncAgora: () => sincronizar(true),
  desligarSync: () => confirmar('Desativar a sincronização neste aparelho? Os dados continuam aqui e na nuvem.', 'Desativar', () => { SY = null; saveSync(); closeSheet(); render(); toast('Sincronização desativada'); }),
  editCat: id => formCat(id),
  kCor: c => { lerCat(); K.cor = c; drawCat(); },
  kAddSub: () => { lerCat(); const n = $('#kSub').value.trim(); if (!n) return; n.split(',').map(x => x.trim()).filter(Boolean).forEach(x => K.subs.push({ id: uid(), nome: x })); drawCat(); },
  kRemSub: id => { lerCat(); K.subs = K.subs.filter(x => x.id !== id); drawCat(); },
  salvarCat: () => {
    lerCat(); const sub = $('#kSub').value.trim(); if (sub) sub.split(',').map(x => x.trim()).filter(Boolean).forEach(x => K.subs.push({ id: uid(), nome: x }));
    if (!K.nome.trim()) { toast('Dê um nome à categoria'); return; }
    const lista = catsDe(ui.catTipo), d = { id: K.id, nome: K.nome.trim(), cor: K.cor, subs: K.subs, oculta: K.oculta };
    const i = lista.findIndex(x => x.id === K.id);
    if (i >= 0) lista[i] = d; else lista.push(d);
    save(); closeSheet(); render(); toast('Categoria salva');
  },
  excluirCat: () => {
    const usada = S.lanc.some(l => l.tipo === ui.catTipo && l.cat === K.id) || S.recs.some(r => r.tipo === ui.catTipo && r.cat === K.id);
    if (usada) { toast('Categoria em uso. Use "Ocultar ao lançar".'); return; }
    if (catsDe(ui.catTipo).length <= 1) { toast('Precisa ter ao menos uma categoria'); return; }
    confirmar(`Excluir a categoria ${K.nome}?`, 'Excluir', () => { const l = catsDe(ui.catTipo); l.splice(l.findIndex(x => x.id === K.id), 1); save(); closeSheet(); render(); });
  },
  fPag: id => { lerFormL(); F.pag = id; if (!card(id)) F.parcelas = 1; drawFormL(); },
  fParc: d => { lerFormL(); F.parcelas = Math.min(48, Math.max(1, F.parcelas + +d)); drawFormL(); },
  salvarL,
  excluirL: () => {
    const i = S.lanc.findIndex(l => l.id === F.id); if (i < 0) return;
    const [rem] = S.lanc.splice(i, 1);
    const recs = S.receber.filter(r => r.origem === rem.id && !r.recebido);
    S.receber = S.receber.filter(r => !recs.includes(r));
    save(); closeSheet(); render();
    toastAcao('Lançamento excluído', 'Desfazer', () => { S.lanc.push(rem); S.receber.push(...recs); save(); render(); toast('Lançamento restaurado'); });
  },
  toastAcao: () => { const f = ACAO; ACAO = null; $('#toast').classList.remove('show', 'acao'); f && f(); },
  duplicarL: () => {
    lerFormL();
    if (!(F.valor > 0)) { toast('Digite um valor'); return; }
    S.lanc.push({ id: uid(), tipo: F.tipo, valor: F.valor, cat: F.cat, pag: F.tipo === 'gasto' ? F.pag : null, data: nowStr(),
      desc: F.desc.replace(/ \(\d+\/\d+\)$/, ''), tags: parseTags(F.tagsTxt), ...(F.sub ? { sub: F.sub } : {}) });
    save(); closeSheet(); render(); toast('Lançado de novo');
  },
  cfOk: () => { const f = CF; CF = null; f && f(); },
  diaMv: d => { ui.dia = addD(ui.dia, +d); render(); },
  diaHoje: () => { ui.dia = todayStr(); render(); },
  mesMv: d => { ui.mes = addM(ui.mes, +d); ui.selCat = null; ui.selSaldo = null; render(); },
  anoMv: d => { ui.ano += +d; ui.selBar = null; render(); },
  modo: id => { ui.modo = id; ui.selCat = null; ui.selBar = null; ui.selSaldo = null; render(); },
  selCat: id => { ui.selCat = ui.selCat === id ? null : id; render(); },
  selBar: i => { ui.selBar = ui.selBar === +i ? null : +i; render(); },
  abrirF: id => { ui.abertaF = ui.abertaF === id ? null : id; render(); },
  pagarF: id => { const [c, r] = id.split('|'); formPagar(c, r); },
  confirmarPag: id => {
    const [c, r] = id.split('|'), v = centsOf($('#pValor'));
    if (!(v > 0)) { toast('Digite o valor pago'); return; }
    S.pags.push({ id: uid(), card: c, ref: r, valor: v, data: $('#pData').value || nowStr() });
    save(); closeSheet(); render(); toast('Fatura marcada como paga');
  },
  desfazerPag: id => confirmar('Desfazer este pagamento?', 'Desfazer', () => { S.pags = S.pags.filter(p => p.id !== id); save(); closeSheet(); render(); }),
  novaRec: () => formRec(null),
  editRec: id => formRec(S.recs.find(r => r.id === id)),
  rTipo: id => { R.desc = $('#rDesc').value; R.tipo = id; drawRec(); },
  rCat: id => { R.desc = $('#rDesc').value; R.cat = id; drawRec(); },
  rPag: id => { R.desc = $('#rDesc').value; R.pag = id; drawRec(); },
  salvarRec,
  encerrarRec: () => confirmar('Parar de lançar este recorrente? Os lançamentos já feitos continuam.', 'Encerrar', () => { S.recs.find(r => r.id === R.id).fim = true; save(); closeSheet(); render(); toast('Recorrente encerrado'); }),
  saldoIni: formSaldo,
  salvarSaldo: () => { S.saldoInicial = centsOf($('#sValor')); S.dataInicial = $('#sData').value || nowStr(); save(); closeSheet(); render(); toast('Saldo salvo'); },
  editCard: id => formCard(id),
  salvarCard: id => {
    const nome = $('#cNome').value.trim(); if (!nome) { toast('Dê um nome ao cartão'); return; }
    const d = { nome, fecha: Math.min(31, Math.max(1, +$('#cFecha').value || 1)), vence: Math.min(31, Math.max(1, +$('#cVence').value || 1)), afeta: $('#cAfeta').checked };
    if (id) Object.assign(card(id), d); else S.cards.push({ id: uid(), ...d });
    save(); closeSheet(); render(); toast('Cartão salvo');
  },
  excluirCard: id => {
    if (S.lanc.some(l => l.pag === id)) { toast('Este cartão tem lançamentos. Exclua-os antes.'); return; }
    confirmar('Remover este cartão?', 'Remover', () => { S.cards = S.cards.filter(c => c.id !== id); save(); closeSheet(); render(); });
  },
  exportar,
  csv: per => exportarCSV(per),
  olho: () => { S.ocultar = !S.ocultar; save(); render(); },
  buscar: () => { if (ui.tab !== 'busca') ui.voltar = ui.tab; ui.tab = 'busca'; render(); scrollTo(0, 0); },
  bPer: id => { ui.bPer = id; render(); },
  bTag: t => { ui.bq = norm(ui.bq) === '#' + t ? '' : '#' + t; if (ui.bq) ui.bPer = 'tudo'; render(); },
  bTipo: id => { ui.bTipo = id; ui.bCat = null; if (id === 'entrada') ui.bPag = null; render(); },
  bCat: id => { ui.bCat = id || null; render(); },
  bPag: id => { ui.bPag = id || null; render(); },
  resumoF: id => { const [c, r] = id.split('|'); resumoFatura(c, r); },
  editMeta: id => formMeta(id),
  salvarMeta: () => {
    const nome = $('#mNome').value.trim(), alvo = centsOf($('#mAlvo')), ja = centsOf($('#mJa'));
    const inicio = $('#mIni').value || ymNow(), prazo = $('#mPrazo').value;
    if (!nome) { toast('Dê um nome à meta'); return; }
    if (!(alvo > 0)) { toast('Digite quanto quer juntar'); return; }
    if (!prazo || prazo < inicio) { toast('O prazo precisa ser depois do início'); return; }
    const d = { nome, alvo, ja, inicio, prazo };
    if (M) Object.assign(M, d); else S.metas.push({ id: uid(), ...d });
    save(); closeSheet(); render(); toast('Meta salva');
  },
  excluirMeta: () => confirmar('Excluir esta meta?', 'Excluir', () => { S.metas = S.metas.filter(m => m !== M); save(); closeSheet(); render(); toast('Meta excluída'); }),
  importar: () => $('#fileImp').click(),
  apagarTudo: () => {
    confirmar(`Apagar todos os dados do app?${SY ? ' Isso também apaga dos outros aparelhos sincronizados.' : ''} Sem backup, não dá para recuperar.`, 'Apagar tudo', () => { const del = S.del; S = { del }; normalizar(); save(); closeSheet(); render(); toast('Dados apagados'); });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.id, el); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.quick'); if (!f) return;
  e.preventDefault(); const inp = f.querySelector('input'); const t = inp.value; inp.value = ''; inp.blur(); abrirFrase(t);
});
document.addEventListener('input', e => { if (e.target.id === 'bq') { ui.bq = e.target.value; $('#bres').innerHTML = resultadosBusca(); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fileImp' && e.target.files[0]) importar(e.target.files[0]);
  if ((id === 'fRep' || id === 'fDiv') && F) { lerFormL(); drawFormL(); }
  if (id === 'nResumo' || id === 'nAgenda') {
    let p = S.prefs.find(x => x.id === 'notif'); if (!p) { p = { id: 'notif', resumo: true, agenda: true }; S.prefs.push(p); }
    p[id === 'nResumo' ? 'resumo' : 'agenda'] = e.target.checked; save(); agendarFila(500);
  }
  if (id === 'cA' || id === 'cB') { if (e.target.value) { ui[id] = e.target.value; render(); } }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'bq' && e.key === 'Enter') e.target.blur();
  if (e.key === 'Escape' && $('.sheet.show')) { closeSheet(); return; }
  const digitando = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (digitando || e.metaKey || e.ctrlKey || e.altKey || $('.sheet.show')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); A.novo(); }
  if (e.key === '/') { e.preventDefault(); A.buscar(); setTimeout(() => $('#bq')?.focus(), 50); }
});
let ultLarg = innerWidth >= 900;
addEventListener('resize', () => { const l = innerWidth >= 900; if (l !== ultLarg) { ultLarg = l; render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sincronizar(); } });
window.addEventListener('online', () => sincronizar());

/* =========================================================
   INÍCIO
   ========================================================= */
load(); render(); abrirPorLink(); sincronizar();
if (pushOk() && Notification.permission === 'granted') inscrever(false).catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && window.self === window.top && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
