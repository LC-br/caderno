<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Finanças</title>
<meta name="theme-color" content="#08111F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: dark;
  --bg:#08111F; --s1:#0F1B30; --s2:#162644; --line:#22355C;
  --ink:#EEF2FA; --ink2:#A9B6CF; --ink3:#6F7FA0;
  --blue:#3D6BFF; --blue2:#86A8FF; --gold:#E8C27A;
  --green:#46D39A; --red:#FF8080;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 96px);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#view{max-width:560px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--s1);color:var(--ink2)}

/* cartão de saldo */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 20px;
  background:radial-gradient(120% 90% at 100% 0%,#2D59E0 0%,rgba(45,89,224,0) 60%),linear-gradient(160deg,#1A3680 0%,#0E1E4A 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hero .lbl{color:#C7D4F5;font-size:14px}
.hero .eye{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#DCE5FB}
.hero .big.oculto{letter-spacing:.08em}
.hero .big{font-size:42px;font-weight:700;margin:2px 0 14px;line-height:1.1}
.hero .after{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.hero .after span:first-child{color:#C7D4F5;font-size:14px}
.hero .after .num{color:var(--gold);font-size:20px;font-weight:600}
.hero .empty{margin-top:6px;color:#DCE5FB}
.hero .cta{margin-top:14px;background:rgba(255,255,255,.14);padding:10px 16px;border-radius:12px;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 22px}
.stat{background:var(--s1);border-radius:18px;padding:12px 12px 14px}
.stat .lbl{color:var(--ink3);font-size:13px}
.stat .num{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap}
.stat{min-width:0;overflow:hidden}

h2{font-size:19px;font-weight:650;margin:22px 2px 10px;letter-spacing:-.01em}
h2 small{font-weight:400;color:var(--ink3);font-size:14px;margin-left:6px}
.sub{color:var(--ink3);font-size:14px}

/* listas */
.list{background:var(--s1);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>*:first-child .row{border-top:0}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{color:var(--ink3);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.rv{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.rv.entrada{color:var(--green)}
.rv.muted,.row.muted .rt{color:var(--ink3)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--s2);color:var(--ink2)}
.emptybox{background:var(--s1);border-radius:20px;padding:26px 18px;text-align:center;color:var(--ink2)}

/* navegação de período */
.pnav{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:16px;padding:6px;margin-bottom:12px}
.pnav button{width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--ink2)}
.pnav button:active{background:var(--s2)}
.pnav .pl{font-weight:600}
.pnav .pl::first-letter{text-transform:uppercase}
.seg{display:flex;background:var(--s1);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:15px}
.seg button.on{background:var(--s2);color:var(--ink)}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cmp{color:var(--ink2);font-size:14px;margin:-2px 2px 12px}

/* gráficos */
.chart{background:var(--s1);border-radius:20px;padding:16px}
.chart svg{display:block;width:100%;height:auto}
.chart path,.chart rect{cursor:pointer}
.legend{margin-top:12px}
.legend .row{padding:10px 0;border-top:1px solid var(--line)}
.legend .row:first-child{border-top:0}
.legend .pct{color:var(--ink3);font-size:13px;width:44px;text-align:right}
.cap{text-align:center;color:var(--ink2);font-size:14px;margin-top:6px;min-height:20px}

/* faturas */
.fcard{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:12px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fhead b{font-size:17px}
.fitem{border-top:1px solid var(--line);padding:12px 0}
.fitem:first-of-type{border-top:0}
.fline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.chip-st{font-size:12px;padding:3px 8px;border-radius:7px;margin-left:6px}
.st-aberta{background:rgba(61,107,255,.18);color:var(--blue2)}
.st-fechada{background:rgba(232,194,122,.16);color:var(--gold)}
.st-vencida{background:rgba(255,128,128,.16);color:var(--red)}
.st-paga{background:rgba(70,211,154,.14);color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--s2);font-weight:600;font-size:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.full{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.danger{color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.proj{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.proj::-webkit-scrollbar{display:none}
.proj div{flex:none;background:var(--s2);border-radius:12px;padding:8px 12px;min-width:92px}
.proj small{display:block;color:var(--ink3);font-size:12px;text-transform:capitalize}
.items{margin-top:8px;background:var(--s2);border-radius:12px}
.items .row{padding:10px 12px}
.bar-prog{height:4px;background:var(--s2);border-radius:2px;margin-top:6px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--blue2);border-radius:2px}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,20,38,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-b) + 6px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
.fab{width:58px;height:58px;border-radius:29px;margin:-26px auto 0;background:linear-gradient(160deg,#4F7BFF,#2A4FD6);color:#fff;display:grid!important;place-items:center;box-shadow:0 8px 24px rgba(42,79,214,.45)}
.fab svg{width:28px!important;height:28px!important}

/* folha (modal) */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.amount{font-family:var(--num);font-size:40px;font-weight:700;text-align:center;background:transparent;border:0;padding:6px 0 10px}
.amount::placeholder{color:var(--ink3)}
.amount.gasto{color:var(--ink)}
.amount.entrada{color:var(--green)}
.field{margin-bottom:14px}
.field>label,.flabel{display:block;color:var(--ink3);font-size:13px;margin:0 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--s2);font-size:15px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;border:1px solid transparent}
.chip.on{color:var(--ink);border-color:var(--blue);background:rgba(61,107,255,.16)}
.chip .dot{width:8px;height:8px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--s2);font-size:20px}
.stepper .num{font-size:20px;font-weight:600;min-width:44px;text-align:center}
.hint{color:var(--ink2);font-size:14px;margin-top:6px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.switch input{width:auto;appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--s2);border:1px solid var(--line);position:relative;padding:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.switch input:checked{background:var(--blue);border-color:var(--blue)}
.switch input:checked::after{transform:translateX(20px)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}

.warnbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(232,194,122,.12);border:1px solid rgba(232,194,122,.35);color:#F2D9A6;border-radius:16px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.warnbar b{color:var(--gold)}
.topbtns{display:flex;gap:8px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:10px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.meta{background:var(--s1);border-radius:20px;padding:16px;margin-bottom:12px;width:100%;text-align:left;display:block}
.meta .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta .mtop b{font-size:17px}
.meta .mval{margin-top:8px;font-size:22px;font-weight:700}
.meta .mval small{font-size:14px;color:var(--ink3);font-weight:500}
.gauge{height:8px;background:var(--s2);border-radius:4px;margin:10px 0 8px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3D6BFF,#86A8FF)}
.gauge.ok i{background:linear-gradient(90deg,#2FB985,#46D39A)}
.toast.acao{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px}
.toast.acao button{background:rgba(255,255,255,.12);color:var(--gold);font-weight:600;padding:7px 12px;border-radius:9px;font-size:15px}
.ttag{font-size:12px;color:var(--blue2)}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,20px);background:#22355C;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs"><div class="in">
  <button data-act="tab" data-id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-act="tab" data-id="dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Dia</button>
  <button class="fab" data-act="novo" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-id="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumo</button>
  <button data-act="tab" data-id="faturas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Faturas</button>
</div></nav>

<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const KEY = 'financas.v1';

const CATS_G = [
  { id: 'alim',   nome: 'Alimentação',          cor: '#d95926' },
  { id: 'transp', nome: 'Transporte',           cor: '#3987e5' },
  { id: 'lazer',  nome: 'Lazer',                cor: '#d55181' },
  { id: 'casa',   nome: 'Casa',                 cor: '#c98500' },
  { id: 'saude',  nome: 'Saúde',                cor: '#199e70' },
  { id: 'edu',    nome: 'Educação',             cor: '#9085e9' },
  { id: 'parc',   nome: 'Parcelas/Assinaturas', cor: '#e66767' },
  { id: 'outros', nome: 'Outros',               cor: '#7d89a3' },
];
const CATS_E = [
  { id: 'salario', nome: 'Salário' },
  { id: 'estagio', nome: 'Estágio' },
  { id: 'pixrec',  nome: 'Pix recebido' },
  { id: 'reemb',   nome: 'Reembolso' },
  { id: 'outrase', nome: 'Outros' },
].map(c => ({ ...c, cor: '#46D39A' }));
const PAGS_FIXOS = [
  { id: 'pix', nome: 'Pix' },
  { id: 'debito', nome: 'Débito' },
  { id: 'dinheiro', nome: 'Dinheiro' },
];
const CARDS_PADRAO = []; // cadastre seus cartões em Ajustes
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => brl.format(Math.round((v || 0) * 100) / 100);
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const parseTags = t => [...new Set(String(t || '').split(/[,;\s]+/).map(x => norm(x.replace(/^#+/, '')).replace(/[^a-z0-9_-]/g, '')).filter(Boolean))];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function nowStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const todayStr = () => nowStr().slice(0, 10);
const ymNow = () => nowStr().slice(0, 7);
function addM(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
function addD(ds, n) { const [y, m, d] = ds.split('-').map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function dim(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
const dateIn = (ym, day) => `${ym}-${pad(Math.min(day, dim(ym)))}`;
const nomeMes = ym => `${MESES[+ym.slice(5, 7) - 1]} de ${ym.slice(0, 4)}`;
const mesSo = ym => MESES[+ym.slice(5, 7) - 1];
const dm = ds => `${ds.slice(8, 10)}/${ds.slice(5, 7)}`;
function nomeDia(ds) {
  if (ds === todayStr()) return 'Hoje';
  if (ds === addD(todayStr(), -1)) return 'Ontem';
  const [y, m, d] = ds.split('-').map(Number);
  return `${SEMANA[new Date(y, m - 1, d).getDay()]}, ${d} de ${MESES[m - 1]}`;
}

/* =========================================================
   DADOS (ficam só neste aparelho)
   ========================================================= */
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || typeof S !== 'object') S = {};
  S.v = 1;
  S.saldoInicial ??= null;
  S.dataInicial ??= null;
  S.cards ??= structuredClone(CARDS_PADRAO);
  S.lanc ??= [];
  S.recs ??= [];
  S.pags ??= [];
  S.metas ??= [];
  S.ultimoBackup ??= null;
  S.ocultar ??= false;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Não consegui salvar. Faça um backup em Ajustes.'); }
}

const card = id => S.cards.find(c => c.id === id);
const isCredito = l => l.tipo === 'gasto' && !!card(l.pag);
const isPai = l => isCredito(l) && !card(l.pag).afeta;
const catOf = l => (l.tipo === 'entrada' ? CATS_E : CATS_G).find(c => c.id === l.cat) || { nome: 'Outros', cor: '#7d89a3' };
const pagNome = id => (PAGS_FIXOS.find(p => p.id === id) || card(id) || { nome: '' }).nome;

/* ---------- faturas ---------- */
// Fatura é identificada pelo mês de vencimento ("2026-12").
// Compra no dia do fechamento ou depois vai para a fatura seguinte.
function refF(data, c) {
  const y = +data.slice(0, 4), m = +data.slice(5, 7), d = +data.slice(8, 10);
  let ref = `${y}-${pad(m)}`;
  if (d >= c.fecha) ref = addM(ref, 1);   // mês em que fecha
  if (c.vence <= c.fecha) ref = addM(ref, 1); // vence no mês seguinte ao fechamento
  return ref;
}
const fechamento = (c, ref) => dateIn(c.vence > c.fecha ? ref : addM(ref, -1), c.fecha);
const vencimento = (c, ref) => dateIn(ref, c.vence);
const refAtual = c => refF(nowStr(), c);
const itensFatura = (cid, ref) => S.lanc.filter(l => l.tipo === 'gasto' && l.pag === cid && refF(l.data, card(cid)) === ref).sort((a, b) => b.data.localeCompare(a.data));
const totalFatura = (cid, ref) => itensFatura(cid, ref).reduce((a, l) => a + l.valor, 0);
const pagoF = (cid, ref) => S.pags.find(p => p.card === cid && p.ref === ref);
function statusF(c, ref) { if (pagoF(c.id, ref)) return 'paga'; const h = todayStr(); if (!c.afeta) return h >= fechamento(c, ref) ? 'fechada' : 'aberta'; if (h > vencimento(c, ref)) return 'vencida'; return h >= fechamento(c, ref) ? 'fechada' : 'aberta'; }
function refsCard(cid) {
  const c = card(cid), now = nowStr(), set = new Set();
  for (const l of S.lanc) if (l.tipo === 'gasto' && l.pag === cid && l.data <= now) set.add(refF(l.data, c));
  return [...set].sort();
}
const pendentes = cid => refsCard(cid).filter(r => !pagoF(cid, r));

/* ---------- saldo ---------- */
function saldo() {
  if (S.saldoInicial == null) return null;
  const di = S.dataInicial, now = nowStr();
  let s = S.saldoInicial;
  for (const l of S.lanc) {
    if (l.data < di || l.data > now) continue;
    if (l.tipo === 'entrada') s += l.valor;
    else if (!card(l.pag)) s -= l.valor; // Pix, débito, dinheiro saem na hora
  }
  for (const p of S.pags) if (p.data >= di) s -= p.valor; // fatura paga sai do saldo
  return s;
}
function totalPendente() {
  let t = 0;
  for (const c of S.cards) if (c.afeta) for (const r of pendentes(c.id)) t += totalFatura(c.id, r);
  return t;
}

/* ---------- totais (Cartão pai fica de fora) ---------- */
const soma = (prefix, tipo) => S.lanc.filter(l => l.tipo === tipo && !isPai(l) && l.data.startsWith(prefix)).reduce((a, l) => a + l.valor, 0);

/* ---------- recorrentes (parcelas, assinaturas, salário) ---------- */
const occ = (r, k) => `${dateIn(addM(r.inicio, k), r.dia)}T${r.hora || '12:00'}`;
function gerar() {
  const now = nowStr(); let mudou = false;
  for (const r of S.recs) {
    if (r.fim) continue;
    while (r.total == null || r.gerados < r.total) {
      const d = occ(r, r.gerados);
      if (d > now) break;
      const k = r.gerados;
      S.lanc.push({ id: uid(), tipo: r.tipo, valor: r.valor, cat: r.cat, pag: r.pag, data: d,
        desc: r.total ? `${r.desc} (${k + 1}/${r.total})` : r.desc, rec: r.id, ...(r.tags && r.tags.length ? { tags: r.tags } : {}) });
      r.gerados++; mudou = true;
    }
  }
  if (mudou) save();
}
// Quanto cada fatura futura já tem comprometido (lançado + previsto)
function previsto(c, ref) {
  let t = totalFatura(c.id, ref);
  for (const r of S.recs) {
    if (r.fim || r.tipo !== 'gasto' || r.pag !== c.id) continue;
    for (let k = r.gerados; r.total == null || k < r.total; k++) {
      const rf = refF(occ(r, k), c);
      if (rf > ref) break;
      if (rf === ref) t += r.valor;
    }
  }
  return t;
}

function diasDesde(ds) {
  const [y, m, d] = ds.slice(0, 10).split('-').map(Number);

  return Math.round((new Date(y2, m2 - 1, d2) - new Date(y, m - 1, d)) / 864e5);

/* ---------- Metas ---------- */
const sobraMes = ym => soma(ym, 'entrada') - soma(ym, 'gasto');
function progressoMeta(m) {
  let t = m.ja || 0;
  const fim = ymNow() < m.prazo ? ymNow() : m.prazo;
  for (let ym = m.inicio; ym <= fim; ym = addM(ym, 1)) t += sobraMes(ym);
  return Math.max(0, t);
}
function mesesEntre(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function vMetas() {
  const cards = S.metas.map(m => {
    const p = progressoMeta(m), pct = Math.min(100, Math.round(p / m.alvo * 100)), falta = m.alvo - p;
    const restam = mesesEntre(ymNow(), m.prazo) + 1;
    let txt;
    if (falta <= 0) txt = 'Meta atingida.';
    else if (restam <= 0) txt = `O prazo acabou e faltaram ${fmt(falta)}.`;
    else txt = `Faltam ${fmt(falta)}. Guardando ${fmt(falta / restam)} por mês, você chega lá em ${mesSo(m.prazo)}${m.prazo.slice(0, 4) !== ymNow().slice(0, 4) ? ' de ' + m.prazo.slice(0, 4) : ''}.`;
    return `<button class="meta" data-act="editMeta" data-id="${m.id}">
      <div class="mtop"><b>${esc(m.nome)}</b><span class="sub">até ${mesSo(m.prazo)} ${m.prazo.slice(0, 4)}</span></div>
      <div class="mval num">${fmt(p)} <small>de ${fmt(m.alvo)}</small></div>
      <div class="gauge ${falta <= 0 ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
      <div class="sub" style="color:var(--ink2)">${pct}%. ${txt}</div></button>`;
  }).join('');
  return `${cards || `<div class="emptybox">Nenhuma meta ainda. Crie uma para acompanhar quanto falta para juntar um valor.</div>`}
  <div style="margin-top:4px"><button class="btn full" data-act="editMeta" data-id="">Nova meta</button></div>
  <p class="sub" style="margin:14px 2px 0">O progresso soma o que sobrou em cada mês (entradas menos gastos) desde o início da meta. Se tiver mais de uma meta, todas usam a mesma sobra.</p>`;
}

/* ---------- Resumo ---------- */
function arc(cx, cy, R, r, s, e) {
  const large = e - s > Math.PI ? 1 : 0, P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
  return `M${P(R, s)}A${R} ${R} 0 ${large} 1 ${P(R, e)}L${P(r, e)}A${r} ${r} 0 ${large} 0 ${P(r, s)}Z`;
}
function donut(itens, total) {
  const cx = 110, cy = 110, R = 100, r = 68;
  let a0 = -Math.PI / 2, out = '';
  const gap = itens.length > 1 ? 0.03 : 0;
  for (const it of itens) {
    const a1 = a0 + it.v / total * Math.PI * 2;
    const op = ui.selCat && ui.selCat !== it.id ? .3 : 1;
    if (itens.length === 1) out += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${it.cor}" stroke-width="${R - r}" data-act="selCat" data-id="${it.id}"/>`;
    else if (a1 - a0 > gap) out += `<path d="${arc(cx, cy, R, r, a0 + gap / 2, a1 - gap / 2)}" fill="${it.cor}" opacity="${op}" data-act="selCat" data-id="${it.id}"/>`;
    a0 = a1;
  }
  const sel = itens.find(i => i.id === ui.selCat);
  const t1 = sel ? sel.nome : 'Gastos', t2 = fmt(sel ? sel.v : total);
  return `<svg viewBox="0 0 220 220" style="max-width:240px;margin:0 auto" role="img" aria-label="Gastos por categoria">${out}
    <text x="110" y="102" text-anchor="middle" fill="#A9B6CF" font-size="13">${esc(t1.length > 18 ? t1.slice(0, 17) + '…' : t1)}</text>
    <text x="110" y="126" text-anchor="middle" fill="#EEF2FA" font-size="20" font-weight="700" style="font-family:var(--num)">${t2}</text></svg>`;
}
function barras(vals) {
  const W = 340, H = 180, top = 14, base = H - 24, cw = W / 12, bw = cw * .58;
  const max = Math.max(...vals, 1);
  let out = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#22355C"/>`;
  vals.forEach((v, i) => {
    const h = v / max * (base - top), x = i * cw + (cw - bw) / 2, y = base - h;
    const rr = Math.min(4, h / 2, bw / 2);
    const op = ui.selBar != null && ui.selBar !== i ? .35 : 1;
    if (h > 0) out += `<path d="M${x} ${base}V${y + rr}Q${x} ${y} ${x + rr} ${y}H${x + bw - rr}Q${x + bw} ${y} ${x + bw} ${y + rr}V${base}Z" fill="#3987e5" opacity="${op}"/>`;
    out += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="${ui.selBar === i ? '#EEF2FA' : '#6F7FA0'}" font-size="11">${MES_CURTO[i]}</text>`;
    out += `<rect x="${i * cw}" y="0" width="${cw}" height="${H}" fill="transparent" data-act="selBar" data-id="${i}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por mês">${out}</svg>`;
}
function porCategoria(prefix) {
  const m = new Map();
  for (const l of S.lanc) if (l.tipo === 'gasto' && !isPai(l) && l.data.startsWith(prefix)) m.set(l.cat, (m.get(l.cat) || 0) + l.valor);
  return CATS_G.filter(c => m.get(c.id) > 0).map(c => ({ ...c, v: m.get(c.id) })).sort((a, b) => b.v - a.v);
}
function legenda(itens, total) {
  return `<div class="legend">${itens.map(i => `<button class="row" data-act="selCat" data-id="${i.id}">
    <span class="dot" style="background:${i.cor}"></span><span class="rmain"><span class="rt">${esc(i.nome)}</span></span>
    <span class="pct">${Math.round(i.v / total * 100)}%</span><span class="rv">${fmt(i.v)}</span></button>`).join('')}</div>`;
}
// gastos e entradas recorrentes que ainda vão cair neste mês (depois de agora)
function futuroMes(ym) {
  const now = nowStr(); let g = 0, e = 0;
  for (const r of S.recs) {
    if (r.fim) continue;
    if (r.tipo === 'gasto' && card(r.pag) && !card(r.pag).afeta) continue;
    for (let k = r.gerados; r.total == null || k < r.total; k++) {
      const d = occ(r, k); if (d.slice(0, 7) > ym) break;
      if (d > now && d.startsWith(ym)) { if (r.tipo === 'gasto') g += r.valor; else e += r.valor; }
    }
  }
  return { g, e };
}
function vResumo() {
  const seg = `<div class="seg"><button class="${ui.modo === 'mes' ? 'on' : ''}" data-act="modo" data-id="mes">Mês</button><button class="${ui.modo === 'ano' ? 'on' : ''}" data-act="modo" data-id="ano">Ano</button><button class="${ui.modo === 'metas' ? 'on' : ''}" data-act="modo" data-id="metas">Metas</button></div>`;
  if (ui.modo === 'metas') return `<div class="top"><h1>Resumo</h1></div>${seg}${vMetas()}`;
  if (ui.modo === 'mes') {
    const m = ui.mes, g = soma(m, 'gasto'), e = soma(m, 'entrada'), ant = soma(addM(m, -1), 'gasto');
    let cmp = '';
    if (ant > 0 && g > 0) {
      const p = Math.round((g - ant) / ant * 100);
      cmp = `<div class="cmp">${p === 0 ? 'Mesmo gasto' : `${Math.abs(p)}% ${p > 0 ? 'a mais' : 'a menos'}`} que em ${mesSo(addM(m, -1))}${m === ymNow() ? ' (mês ainda em andamento)' : ''}.</div>`;
    }
    const cats = porCategoria(m);
    const atual = m === ymNow(), diasMes = dim(m), hojeDia = +todayStr().slice(8, 10);
    const diasCorridos = atual ? hojeDia : (m < ymNow() ? diasMes : 0);
    let diario = '';
    if (diasCorridos > 0) {
      const media = g / diasCorridos;
      let pode = '';
      if (atual) {
        const fut = futuroMes(m), restam = diasMes - hojeDia + 1;
        const livre = e + fut.e - g - fut.g;
        pode = `<div class="stat"><div class="lbl">Pode gastar por dia</div><div class="num" style="color:${livre > 0 ? 'var(--gold)' : 'var(--red)'}">${livre > 0 ? fmt(livre / restam) : fmt(0)}</div></div>`;
      }
      diario = `<div class="${pode ? 'two' : ''}" style="margin-bottom:12px">
        <div class="stat"><div class="lbl">Média por dia</div><div class="num">${fmt(media)}</div></div>${pode}</div>
        ${atual ? `<p class="sub" style="margin:-4px 2px 12px">"Pode gastar por dia" divide o que ainda sobra do mês (já contando parcelas e entradas fixas que faltam cair) pelos ${diasMes - hojeDia + 1} dias restantes, incluindo hoje.</p>` : ''}`;
    }
    const top5 = S.lanc.filter(l => l.tipo === 'gasto' && !isPai(l) && l.data.startsWith(m)).sort((a, b) => b.valor - a.valor).slice(0, 5);
    return `<div class="top"><h1>Resumo</h1></div>${seg}
    <div class="pnav"><button data-act="mesMv" data-id="-1" aria-label="Mês anterior">‹</button><span class="pl">${nomeMes(m)}</span><button data-act="mesMv" data-id="1" aria-label="Próximo mês">›</button></div>
    <div class="trio">
      <div class="stat"><div class="lbl">Entradas</div><div class="num" style="color:var(--green)">${fmt(e)}</div></div>
      <div class="stat"><div class="lbl">Gastos</div><div class="num">${fmt(g)}</div></div>
      <div class="stat"><div class="lbl">Sobrou</div><div class="num" style="color:${e - g >= 0 ? 'var(--gold)' : 'var(--red)'}">${fmt(e - g)}</div></div>
    </div>${cmp}${diario}
    ${cats.length ? `<div class="chart">${donut(cats, g)}${legenda(cats, g)}</div>` : `<div class="emptybox">Sem gastos neste mês.</div>`}
    ${top5.length ? `<h2>Maiores gastos</h2><div class="list">${top5.map(l => rowL(l, { comData: true })).join('')}</div>` : ''}`;
  }
  const y = ui.ano, vals = [...Array(12)].map((_, i) => soma(`${y}-${pad(i + 1)}`, 'gasto'));
  const g = vals.reduce((a, b) => a + b, 0), e = soma(String(y), 'entrada');
  const cats = porCategoria(String(y));
  const cap = ui.selBar != null ? `${MESES[ui.selBar]}: <b class="num">${fmt(vals[ui.selBar])}</b>` : 'Toque numa barra para ver o valor';
  return `<div class="top"><h1>Resumo</h1></div>${seg}
  <div class="pnav"><button data-act="anoMv" data-id="-1" aria-label="Ano anterior">‹</button><span class="pl">${y}</span><button data-act="anoMv" data-id="1" aria-label="Próximo ano">›</button></div>
  <div class="trio">
    <div class="stat"><div class="lbl">Entradas</div><div class="num" style="color:var(--green)">${fmt(e)}</div></div>
    <div class="stat"><div class="lbl">Gastos</div><div class="num">${fmt(g)}</div></div>
    <div class="stat"><div class="lbl">Sobrou</div><div class="num" style="color:${e - g >= 0 ? 'var(--gold)' : 'var(--red)'}">${fmt(e - g)}</div></div>
  </div>
  <div class="chart">${barras(vals)}<div class="cap">${cap}</div></div>
  ${cats.length ? `<h2>Por categoria</h2><div class="chart">${legenda(cats, g)}</div>` : ''}`;
}

/* ---------- Faturas ---------- */
function vFaturas() {
  const meus = S.cards.filter(c => c.afeta), pais = S.cards.filter(c => !c.afeta);
  const bloco = c => {
    const atual = refAtual(c);
    const refs = c.afeta ? [...new Set([...pendentes(c.id), atual])].sort()
      : [...new Set([...refsCard(c.id).filter(r => r < atual).slice(-2), atual])].sort();
    const itensRef = refs.map(r => {
      const st = statusF(c, r), tot = totalFatura(c.id, r), aberto = ui.abertaF === c.id + r;
      const itens = itensFatura(c.id, r);
      return `<div class="fitem">
        <button class="fline" data-act="abrirF" data-id="${c.id + r}">
          <span><span style="text-transform:capitalize">${mesSo(r)}</span><span class="chip-st st-${st}">${st}</span><br><span class="sub">fecha ${dm(fechamento(c, r))}, vence ${dm(vencimento(c, r))}</span></span>
          <span class="rv">${fmt(tot)}</span></button>
        ${c.afeta && st !== 'paga' && tot > 0 ? `<div style="margin-top:10px"><button class="btn sm" data-act="pagarF" data-id="${c.id}|${r}">Marcar como paga</button></div>` : ''}
        ${!c.afeta && tot > 0 ? `<div style="margin-top:10px"><button class="btn sm" data-act="resumoF" data-id="${c.id}|${r}">Enviar resumo</button></div>` : ''}
        ${aberto ? `<div class="items">${itens.length ? itens.map(l => rowL(l, { comData: true })).join('') : '<div class="row sub">Sem compras</div>'}</div>` : ''}
      </div>`;
    }).join('');
    const proj = [];
    for (let i = 1; i <= 6; i++) { const r = addM(atual, i), v = previsto(c, r); if (v > 0) proj.push(`<div><small>${mesSo(r)}</small><span class="num">${fmt(v)}</span></div>`); }
    const pagas = S.pags.filter(p => p.card === c.id).sort((a, b) => b.ref.localeCompare(a.ref)).slice(0, 2);
    return `<div class="fcard"><div class="fhead"><b>${esc(c.nome)}</b><span class="sub">${c.afeta ? '' : 'não afeta seu saldo'}</span></div>
      ${itensRef}
      ${proj.length ? `<div class="flabel" style="margin-top:10px">Já comprometido nos próximos meses</div><div class="proj">${proj.join('')}</div>` : ''}
      ${pagas.length ? `<div class="flabel" style="margin-top:12px">Pagas recentemente</div>${pagas.map(p => `<div class="fline sub" style="padding:4px 0"><span style="text-transform:capitalize">${mesSo(p.ref)}, paga em ${dm(p.data)}</span><span>${fmt(p.valor)} <button class="btn sm" data-act="desfazerPag" data-id="${p.id}">Desfazer</button></span></div>`).join('')}` : ''}
    </div>`;
  };
  const recs = S.recs.filter(r => !r.fim && (r.total == null || r.gerados < r.total));
  return `<div class="top"><h1>Faturas</h1></div>
  ${S.cards.length ? '' : `<div class="emptybox" style="margin-bottom:12px">Nenhum cartão de crédito cadastrado.<div style="margin-top:12px"><button class="btn pri" data-act="editCard" data-id="">Cadastrar cartão</button></div></div>`}
  ${meus.map(bloco).join('')}
  <h2>Parcelas e recorrentes <small>${recs.length ? recs.length + ' ativos' : ''}</small></h2>
  ${recs.length ? `<div class="list">${recs.map(r => `<button class="row" data-act="editRec" data-id="${r.id}">
      <span class="dot" style="background:${catOf(r).cor}"></span>
      <span class="rmain"><span class="rt">${esc(r.desc || catOf(r).nome)}</span>
        <span class="rs"><span>${r.tipo === 'entrada' ? 'entrada' : esc(pagNome(r.pag))}</span><span>dia ${r.dia}</span><span>${r.total ? `${r.gerados} de ${r.total}` : 'todo mês'}</span></span>
        ${r.total ? `<span class="bar-prog"><i style="width:${r.gerados / r.total * 100}%"></i></span>` : ''}</span>
      <span class="rv ${r.tipo}">${fmt(r.valor)}</span></button>`).join('')}</div>` : `<div class="emptybox">Nenhuma parcela ou assinatura. Cadastre uma abaixo, ou faça uma compra parcelada no crédito pelo +.</div>`}
  <div style="margin-top:10px"><button class="btn full" data-act="novaRec">Nova assinatura, parcela ou entrada fixa</button></div>
  ${pais.length ? `<h2>Só para consulta</h2>${pais.map(bloco).join('')}` : ''}`;
}

/* =========================================================
   FOLHAS (formulários)
   ========================================================= */
function openSheet(html, onMount) {
  const aberta = $('.sheet.show');
  if (aberta) { // já está aberta: só troca o conteúdo, sem animar de novo
    const y = aberta.scrollTop; aberta.querySelector('.in').innerHTML = html; aberta.scrollTop = y;
    onMount && onMount(aberta); return;
  }
  $('#layer').innerHTML = `<div class="backdrop" data-act="fechar"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="in">${html}</div></div>`;
  requestAnimationFrame(() => { $('.backdrop').classList.add('show'); $('.sheet').classList.add('show'); });
  onMount && onMount($('.sheet'));
}
function closeSheet() {
  const b = $('.backdrop'), s = $('.sheet'); if (!s) return;
  b.classList.remove('show'); s.classList.remove('show');
  setTimeout(() => { $('#layer').innerHTML = ''; }, 260);
}
function moneyInput(el, valor) {
  const set = c => { el.dataset.cents = c; el.value = c ? fmt(c / 100) : ''; };
  set(Math.round((valor || 0) * 100));
  el.addEventListener('input', () => set(parseInt(el.value.replace(/\D/g, '') || '0', 10)));
}
const centsOf = el => (+el.dataset.cents || 0) / 100;
function chips(list, sel, act) {
  return `<div class="chips">${list.map(i => `<button type="button" class="chip ${i.id === sel ? 'on' : ''}" data-act="${act}" data-id="${i.id}">${i.cor ? `<span class="dot" style="background:${i.cor}"></span>` : ''}${esc(i.nome)}</button>`).join('')}</div>`;
}

/* ---------- novo / editar lançamento ---------- */
let F = null;
function formL(l) {
  const novo = !l;
  F = l ? { ...l, tagsTxt: (l.tags || []).join(', ') } : { tipo: 'gasto', valor: 0, cat: 'alim', pag: 'pix', data: nowStr(), desc: '', tagsTxt: '', parcelas: 1, repetir: false };
  F.novo = novo;
  drawFormL();
}
function drawFormL() {
  const pags = [...PAGS_FIXOS, ...S.cards];
  const cred = F.tipo === 'gasto' && !!card(F.pag);
  const cats = F.tipo === 'gasto' ? CATS_G : CATS_E;
  if (!cats.find(c => c.id === F.cat)) F.cat = cats[0].id;
  const v = F._el ? centsOf(F._el) : F.valor;
  openSheet(`
    <h3>${F.novo ? 'Novo lançamento' : 'Editar lançamento'}<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    <div class="seg"><button type="button" class="${F.tipo === 'gasto' ? 'on' : ''}" data-act="fTipo" data-id="gasto">Gasto</button><button type="button" class="${F.tipo === 'entrada' ? 'on' : ''}" data-act="fTipo" data-id="entrada">Entrada</button></div>
    <input class="amount ${F.tipo}" id="fValor" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off">
    ${F.novo && cred && F.parcelas > 1 ? `<div class="hint" id="fParcHint" style="text-align:center;margin:-6px 0 12px"></div>` : ''}
    <div class="field"><span class="flabel">Categoria</span>${chips(cats, F.cat, 'fCat')}</div>
    ${F.tipo === 'gasto' ? `<div class="field"><span class="flabel">Forma de pagamento</span>${chips(pags, F.pag, 'fPag')}</div>` : ''}
    ${F.novo && cred ? `<div class="field"><span class="flabel">Parcelas</span><div class="stepper"><button type="button" data-act="fParc" data-id="-1">−</button><span class="num">${F.parcelas}x</span><button type="button" data-act="fParc" data-id="1">+</button></div></div>` : ''}
    ${F.novo && !(cred && F.parcelas > 1) ? `<div class="field switch"><span>Repetir todo mês</span><input type="checkbox" id="fRep" ${F.repetir ? 'checked' : ''}></div>` : ''}
    <div class="field"><label for="fDesc">Descrição (opcional)</label><input id="fDesc" value="${esc(F.desc)}" placeholder="${F.tipo === 'gasto' ? 'Ex.: almoço' : 'Ex.: salário de novembro'}"></div>
    <div class="field"><label for="fTags">Tags (opcional)</label><input id="fTags" value="${esc(F.tagsTxt)}" placeholder="Ex.: viagem-rio, aniversario" autocapitalize="off"></div>
    <div class="field"><label for="fData">Data e hora</label><input id="fData" type="datetime-local" value="${F.data}"></div>
    <button class="btn pri full" data-act="salvarL">Salvar</button>
    ${!F.novo ? `<div class="actions" style="margin-top:10px"><button class="btn" data-act="duplicarL">Lançar de novo agora</button><button class="btn danger" data-act="excluirL">Excluir</button></div>` : ''}
  `, sh => {
    const el = sh.querySelector('#fValor'); F._el = el; moneyInput(el, v);
    const hint = () => { const h = sh.querySelector('#fParcHint'); if (h) h.textContent = `${F.parcelas}x de ${fmt(Math.round(centsOf(el) / F.parcelas * 100) / 100)}`; };
    el.addEventListener('input', hint); hint();
    if (F.novo && !v && !F._focou) { F._focou = true; setTimeout(() => el.focus(), 300); }
  });
}
function lerFormL() {
  F.valor = centsOf(F._el);
  F.desc = $('#fDesc').value.trim();
  F.tagsTxt = $('#fTags').value;
  F.data = $('#fData').value || nowStr();
  const rep = $('#fRep'); if (rep) F.repetir = rep.checked;
}
function salvarL() {
  lerFormL();
  if (!(F.valor > 0)) { toast('Digite um valor'); return; }
  const pag = F.tipo === 'gasto' ? F.pag : null;
  const cred = F.tipo === 'gasto' && !!card(pag);
  if (F.novo && ((cred && F.parcelas > 1) || F.repetir)) {
    const n = cred && F.parcelas > 1 ? F.parcelas : null;
    S.recs.push({ id: uid(), tipo: F.tipo, desc: F.desc || catOf(F).nome, valor: n ? Math.round(F.valor / n * 100) / 100 : F.valor,
      cat: F.cat, pag, dia: +F.data.slice(8, 10), hora: F.data.slice(11, 16), inicio: F.data.slice(0, 7), total: n, gerados: 0, tags: parseTags(F.tagsTxt) });
    toast(n ? `Compra em ${n}x salva` : 'Lançamento recorrente salvo');
  } else if (F.novo) {
    S.lanc.push({ id: uid(), tipo: F.tipo, valor: F.valor, cat: F.cat, pag, data: F.data, desc: F.desc, tags: parseTags(F.tagsTxt) });
    toast(F.tipo === 'gasto' ? 'Gasto salvo' : 'Entrada salva');
  } else {
    const l = S.lanc.find(x => x.id === F.id);
    Object.assign(l, { tipo: F.tipo, valor: F.valor, cat: F.cat, pag, data: F.data, desc: F.desc, tags: parseTags(F.tagsTxt) });
    toast('Alterações salvas');
  }
  save(); closeSheet(); render();
}

/* ---------- recorrentes ---------- */
let R = null;
function formRec(r) {
  R = r ? { ...r } : { tipo: 'gasto', desc: '', valor: 0, cat: 'parc', pag: 'pix', dia: +todayStr().slice(8, 10), inicio: ymNow(), total: null, gerados: 0 };
  R.novo = !r; drawRec();
}
function drawRec() {
  const cats = R.tipo === 'gasto' ? CATS_G : CATS_E;
  if (!cats.find(c => c.id === R.cat)) R.cat = cats[0].id;
  const v = R._el ? centsOf(R._el) : R.valor;
  openSheet(`
    <h3>${R.novo ? 'Novo recorrente' : 'Editar recorrente'}<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    ${R.novo ? `<div class="seg"><button type="button" class="${R.tipo === 'gasto' ? 'on' : ''}" data-act="rTipo" data-id="gasto">Gasto</button><button type="button" class="${R.tipo === 'entrada' ? 'on' : ''}" data-act="rTipo" data-id="entrada">Entrada</button></div>` : ''}
    <div class="field"><label for="rDesc">Nome</label><input id="rDesc" value="${esc(R.desc)}" placeholder="${R.tipo === 'gasto' ? 'Ex.: Spotify, celular' : 'Ex.: salário'}"></div>
    <div class="field"><label for="rValor">Valor por mês${R.tipo === 'gasto' ? ' (ou de cada parcela)' : ''}</label><input id="rValor" inputmode="numeric" placeholder="R$ 0,00"></div>
    <div class="field"><span class="flabel">Categoria</span>${chips(cats, R.cat, 'rCat')}</div>
    ${R.tipo === 'gasto' ? `<div class="field"><span class="flabel">Forma de pagamento</span>${chips([...PAGS_FIXOS, ...S.cards], R.pag, 'rPag')}</div>` : ''}
    <div class="two">
      <div class="field"><label for="rDia">Dia do mês</label><input id="rDia" type="number" min="1" max="31" inputmode="numeric" value="${R.dia}"></div>
      <div class="field"><label for="rIni">Começa em</label><input id="rIni" type="month" value="${R.inicio}" ${R.novo ? '' : 'disabled'}></div>
    </div>
    <div class="field"><label for="rTot">Quantidade de parcelas</label><input id="rTot" type="number" min="1" inputmode="numeric" value="${R.total ?? ''}" placeholder="Deixe vazio para repetir sem fim"></div>
    ${!R.novo ? `<p class="hint" style="margin:-6px 2px 14px">Mudanças valem para os próximos lançamentos. Os que já foram lançados não mudam.</p>` : ''}
    <button class="btn pri full" data-act="salvarRec">Salvar</button>
    ${!R.novo ? `<div style="margin-top:10px"><button class="btn danger full" data-act="encerrarRec">Encerrar (parar de lançar)</button></div>` : ''}
  `, sh => { const el = sh.querySelector('#rValor'); R._el = el; moneyInput(el, v); });
}
function salvarRec() {
  R.desc = $('#rDesc').value.trim(); R.valor = centsOf(R._el);
  R.dia = Math.min(31, Math.max(1, parseInt($('#rDia').value, 10) || 1));
  if (R.novo) R.inicio = $('#rIni').value || ymNow();
  const t = parseInt($('#rTot').value, 10); R.total = t > 0 ? t : null;
  if (!(R.valor > 0)) { toast('Digite um valor'); return; }
  if (R.total != null && R.total < R.gerados) R.total = R.gerados;
  const dados = { id: R.id || uid(), tipo: R.tipo, desc: R.desc || catOf(R).nome, valor: R.valor, cat: R.cat, pag: R.tipo === 'gasto' ? R.pag : null,
    dia: R.dia, hora: R.hora || '12:00', inicio: R.inicio, total: R.total, gerados: R.gerados };
  if (R.novo) S.recs.push(dados); else Object.assign(S.recs.find(x => x.id === R.id), dados);
  save(); closeSheet(); render(); toast('Recorrente salvo');
}

  `, sh => { const el = sh.querySelector('#sValor'); moneyInput(el, S.saldoInicial || 0); setTimeout(() => el.focus(), 300); });
}

/* ---------- cartão ---------- */
function formCard(id) {
  const c = card(id) || { id: '', nome: '', fecha: 3, vence: 10, afeta: true };
  openSheet(`
    <h3>${c.id ? 'Editar cartão' : 'Novo cartão'}<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    <div class="field"><label for="cNome">Nome</label><input id="cNome" value="${esc(c.nome)}" placeholder="Ex.: Cartão principal"></div>
    <div class="two">
      <div class="field"><label for="cFecha">Dia de fechamento</label><input id="cFecha" type="number" min="1" max="31" inputmode="numeric" value="${c.fecha}"></div>
      <div class="field"><label for="cVence">Dia de vencimento</label><input id="cVence" type="number" min="1" max="31" inputmode="numeric" value="${c.vence}"></div>
    </div>
    <div class="field switch"><span>Gastos neste cartão afetam meu saldo</span><input type="checkbox" id="cAfeta" ${c.afeta ? 'checked' : ''}></div>
    <button class="btn pri full" data-act="salvarCard" data-id="${c.id}">Salvar</button>
    ${c.id ? `<div style="margin-top:10px"><button class="btn danger full" data-act="excluirCard" data-id="${c.id}">Remover cartão</button></div>` : ''}
  `);
}

/* ---------- pagar fatura ---------- */
function formPagar(cid, ref) {
  const c = card(cid), tot = totalFatura(cid, ref);
  openSheet(`
    <h3>Pagar fatura<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    <p class="hint" style="margin:0 2px 10px">${esc(c.nome)}, fatura de ${mesSo(ref)}. O valor pago sai do seu saldo.</p>
    <input class="amount" id="pValor" inputmode="numeric">
    <div class="field"><label for="pData">Pago em</label><input id="pData" type="datetime-local" value="${nowStr()}"></div>
    <button class="btn pri full" data-act="confirmarPag" data-id="${cid}|${ref}">Confirmar pagamento</button>
  `, sh => moneyInput(sh.querySelector('#pValor'), tot));
}

/* ---------- meta ---------- */
let M = null;
function formMeta(id) {
  M = S.metas.find(m => m.id === id) || null;
  const m = M || { nome: '', alvo: 0, prazo: addM(ymNow(), 6), inicio: ymNow(), ja: 0 };
  openSheet(`
    <h3>${M ? 'Editar meta' : 'Nova meta'}<button class="btn sm" data-act="fechar">Cancelar</button></h3>
    <div class="field"><label for="mNome">Nome</label><input id="mNome" value="${esc(m.nome)}" placeholder="Ex.: viagem, reserva de emergência"></div>
    <div class="field"><label for="mAlvo">Quanto quer juntar</label><input id="mAlvo" inputmode="numeric" placeholder="R$ 0,00"></div>
    <div class="two">
      <div class="field"><label for="mIni">Começa em</label><input id="mIni" type="month" value="${m.inicio}"></div>
      <div class="field"><label for="mPrazo">Até</label><input id="mPrazo" type="month" value="${m.prazo}"></div>
    </div>
    <div class="field"><label for="mJa">Já tenho guardado (opcional)</label><input id="mJa" inputmode="numeric" placeholder="R$ 0,00"></div>
    <button class="btn pri full" data-act="salvarMeta">Salvar</button>
    ${M ? `<div style="margin-top:10px"><button class="btn danger full" data-act="excluirMeta">Excluir meta</button></div>` : ''}
  `, sh => { moneyInput(sh.querySelector('#mAlvo'), m.alvo); moneyInput(sh.querySelector('#mJa'), m.ja); });
}

/* ---------- resumo de fatura para enviar ---------- */
async function resumoFatura(cid, ref) {
  const c = card(cid), itens = itensFatura(cid, ref).slice().reverse();
  const linhas = itens.map(l => `${dm(l.data)}  ${l.desc || catOf(l).nome}: ${fmt(l.valor)}`);
  const texto = `Gastos no ${c.nome}, fatura de ${mesSo(ref)} (vence ${dm(vencimento(c, ref))}):\n\n${linhas.join('\n')}\n\nTotal: ${fmt(totalFatura(cid, ref))}`;
  try {
    if (navigator.share) { await navigator.share({ text: texto }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(texto); toast('Resumo copiado. Cole no WhatsApp.'); }
  catch (e) { openSheet(`<h3>Resumo<button class="btn sm" data-act="fechar">Fechar</button></h3><p class="hint" style="margin:0 2px 10px">Copie o texto abaixo.</p><textarea style="width:100%;height:260px;background:var(--s2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:15px/1.4 -apple-system,system-ui">${esc(texto)}</textarea>`); }
}

/* ---------- backup ---------- */
async function exportar() {
  const nome = `financas-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const file = new File([blob], nome, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup Finanças' }); backupFeito(); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  backupFeito();
}
async function exportarCSV(per) {
  const ym = ymNow(), pre = per === 'mes' ? ym : per === 'ano' ? ym.slice(0, 4) : '';
  const linhas = S.lanc.filter(l => l.data.startsWith(pre)).sort((a, b) => a.data.localeCompare(b.data));
  if (!linhas.length) { toast('Nenhum lançamento nesse período'); return; }
  const q = v => { v = String(v ?? ''); return /[";\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const num = v => v.toFixed(2).replace('.', ',');
  const cab = ['Data', 'Hora', 'Tipo', 'Descrição', 'Categoria', 'Pagamento', 'Valor', 'Fatura', 'Conta no saldo', 'Tags'];
  const corpo = linhas.map(l => {
    const c = isCredito(l) ? card(l.pag) : null;
    return [`${l.data.slice(8, 10)}/${l.data.slice(5, 7)}/${l.data.slice(0, 4)}`, l.data.slice(11, 16), l.tipo === 'gasto' ? 'Gasto' : 'Entrada',
      l.desc || '', catOf(l).nome, l.tipo === 'gasto' ? pagNome(l.pag) : '', num(l.tipo === 'gasto' ? -l.valor : l.valor),
      c ? `${mesSo(refF(l.data, c))}/${refF(l.data, c).slice(0, 4)}` : '', isPai(l) ? 'Não' : 'Sim', (l.tags || []).join(' ')].map(q).join(';');
  });
  const csv = '﻿' + [cab.join(';'), ...corpo].join('\r\n');
  const nome = `financas-${pre || 'tudo'}.csv`;
  const blob = new Blob([csv], { type: 'text/csv' }), file = new File([blob], nome, { type: 'text/csv' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}
function backupFeito() { S.ultimoBackup = nowStr(); save(); render(); toast('Backup exportado'); }
function importar(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.lanc)) throw 0;
      confirmar(`Substituir os dados atuais pelos do backup (${d.lanc.length} lançamentos)?`, 'Substituir', () => {
        localStorage.setItem(KEY, JSON.stringify(d)); load(); closeSheet(); render(); toast('Backup importado'); });
    } catch (e) { toast('Este arquivo não é um backup do Finanças'); }
  };
  rd.readAsText(file);
}

let CF = null;
function confirmar(msg, ok, fn) {
  CF = fn;
  openSheet(`<h3>${esc(msg)}</h3><div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="cfOk">${esc(ok)}</button></div>`);
}
let tT;
let ACAO = null;
function toastAcao(msg, label, fn) {
  const t = $('#toast'); ACAO = fn; t.innerHTML = `<span>${esc(msg)}</span><button data-act="toastAcao">${esc(label)}</button>`;
  t.classList.add('show', 'acao'); clearTimeout(tT); tT = setTimeout(() => { t.classList.remove('show', 'acao'); ACAO = null; }, 5000);
}
function toast(msg) { const t = $('#toast'); t.classList.remove('acao'); ACAO = null; t.textContent = msg; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2000); }

/* =========================================================
   AÇÕES
   ========================================================= */
const A = {
  tab: id => { ui.tab = id; ui.selCat = null; ui.selBar = null; render(); scrollTo(0, 0); },
  novo: () => formL(null),
  editL: id => formL(S.lanc.find(l => l.id === id)),
  fechar: closeSheet,
  fTipo: id => { lerFormL(); F.tipo = id; drawFormL(); },
  fCat: id => { lerFormL(); F.cat = id; drawFormL(); },
  fPag: id => { lerFormL(); F.pag = id; if (!card(id)) F.parcelas = 1; drawFormL(); },
  fParc: d => { lerFormL(); F.parcelas = Math.min(48, Math.max(1, F.parcelas + +d)); drawFormL(); },
  salvarL,
  excluirL: () => {
    const i = S.lanc.findIndex(l => l.id === F.id); if (i < 0) return;
    const [rem] = S.lanc.splice(i, 1); save(); closeSheet(); render();
    toastAcao('Lançamento excluído', 'Desfazer', () => { S.lanc.push(rem); save(); render(); toast('Lançamento restaurado'); });
  },
  toastAcao: () => { const f = ACAO; ACAO = null; $('#toast').classList.remove('show', 'acao'); f && f(); },
  duplicarL: () => {
    lerFormL();
    if (!(F.valor > 0)) { toast('Digite um valor'); return; }
    S.lanc.push({ id: uid(), tipo: F.tipo, valor: F.valor, cat: F.cat, pag: F.tipo === 'gasto' ? F.pag : null, data: nowStr(),
      desc: F.desc.replace(/ \(\d+\/\d+\)$/, ''), tags: parseTags(F.tagsTxt) });
    save(); closeSheet(); render(); toast('Lançado de novo');
  },
  cfOk: () => { const f = CF; CF = null; f && f(); },
  diaMv: d => { ui.dia = addD(ui.dia, +d); render(); },
  diaHoje: () => { ui.dia = todayStr(); render(); },
  mesMv: d => { ui.mes = addM(ui.mes, +d); ui.selCat = null; render(); },
  anoMv: d => { ui.ano += +d; ui.selBar = null; render(); },
  modo: id => { ui.modo = id; ui.selCat = null; ui.selBar = null; render(); },
  selCat: id => { ui.selCat = ui.selCat === id ? null : id; render(); },
  selBar: i => { ui.selBar = ui.selBar === +i ? null : +i; render(); },
  abrirF: id => { ui.abertaF = ui.abertaF === id ? null : id; render(); },
  pagarF: id => { const [c, r] = id.split('|'); formPagar(c, r); },
  confirmarPag: id => {
    const [c, r] = id.split('|'), v = centsOf($('#pValor'));
    if (!(v > 0)) { toast('Digite o valor pago'); return; }
    S.pags.push({ id: uid(), card: c, ref: r, valor: v, data: $('#pData').value || nowStr() });
    save(); closeSheet(); render(); toast('Fatura marcada como paga');
  },
  desfazerPag: id => confirmar('Desfazer este pagamento?', 'Desfazer', () => { S.pags = S.pags.filter(p => p.id !== id); save(); closeSheet(); render(); }),
  novaRec: () => formRec(null),
  editRec: id => formRec(S.recs.find(r => r.id === id)),
  rTipo: id => { R.desc = $('#rDesc').value; R.tipo = id; drawRec(); },
  rCat: id => { R.desc = $('#rDesc').value; R.cat = id; drawRec(); },
  rPag: id => { R.desc = $('#rDesc').value; R.pag = id; drawRec(); },
  salvarRec,
  encerrarRec: () => confirmar('Parar de lançar este recorrente? Os lançamentos já feitos continuam.', 'Encerrar', () => { S.recs.find(r => r.id === R.id).fim = true; save(); closeSheet(); render(); toast('Recorrente encerrado'); }),
  saldoIni: formSaldo,
  salvarSaldo: () => { S.saldoInicial = centsOf($('#sValor')); S.dataInicial = $('#sData').value || nowStr(); save(); closeSheet(); render(); toast('Saldo salvo'); },
  editCard: id => formCard(id),
  salvarCard: id => {
    const nome = $('#cNome').value.trim(); if (!nome) { toast('Dê um nome ao cartão'); return; }
    const d = { nome, fecha: Math.min(31, Math.max(1, +$('#cFecha').value || 1)), vence: Math.min(31, Math.max(1, +$('#cVence').value || 1)), afeta: $('#cAfeta').checked };
    if (id) Object.assign(card(id), d); else S.cards.push({ id: uid(), ...d });
    save(); closeSheet(); render(); toast('Cartão salvo');
  },
  excluirCard: id => {
    if (S.lanc.some(l => l.pag === id)) { toast('Este cartão tem lançamentos. Exclua-os antes.'); return; }
    confirmar('Remover este cartão?', 'Remover', () => { S.cards = S.cards.filter(c => c.id !== id); save(); closeSheet(); render(); });
  },
  exportar,
  csv: per => exportarCSV(per),
  olho: () => { S.ocultar = !S.ocultar; save(); render(); },
  buscar: () => { if (ui.tab !== 'busca') ui.voltar = ui.tab; ui.tab = 'busca'; render(); scrollTo(0, 0); },
  bPer: id => { ui.bPer = id; render(); },
  bTag: t => { ui.bq = norm(ui.bq) === '#' + t ? '' : '#' + t; if (ui.bq) ui.bPer = 'tudo'; render(); },
  bTipo: id => { ui.bTipo = id; ui.bCat = null; if (id === 'entrada') ui.bPag = null; render(); },
  bCat: id => { ui.bCat = id || null; render(); },
  bPag: id => { ui.bPag = id || null; render(); },
  resumoF: id => { const [c, r] = id.split('|'); resumoFatura(c, r); },
  editMeta: id => formMeta(id),
  salvarMeta: () => {
    const nome = $('#mNome').value.trim(), alvo = centsOf($('#mAlvo')), ja = centsOf($('#mJa'));
    const inicio = $('#mIni').value || ymNow(), prazo = $('#mPrazo').value;
    if (!nome) { toast('Dê um nome à meta'); return; }
    if (!(alvo > 0)) { toast('Digite quanto quer juntar'); return; }
    if (!prazo || prazo < inicio) { toast('O prazo precisa ser depois do início'); return; }
    const d = { nome, alvo, ja, inicio, prazo };
    if (M) Object.assign(M, d); else S.metas.push({ id: uid(), ...d });
    save(); closeSheet(); render(); toast('Meta salva');
  },
  excluirMeta: () => confirmar('Excluir esta meta?', 'Excluir', () => { S.metas = S.metas.filter(m => m !== M); save(); closeSheet(); render(); toast('Meta excluída'); }),
  importar: () => $('#fileImp').click(),
  apagarTudo: () => {
    confirmar('Apagar todos os dados do app? Sem backup, não dá para recuperar.', 'Apagar tudo', () => { localStorage.removeItem(KEY); load(); closeSheet(); render(); toast('Dados apagados'); });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.id); }
});
document.addEventListener('input', e => { if (e.target.id === 'bq') { ui.bq = e.target.value; $('#bres').innerHTML = resultadosBusca(); } });
document.addEventListener('change', e => { if (e.target.id === 'fileImp' && e.target.files[0]) importar(e.target.files[0]); });
document.addEventListener('keydown', e => { if (e.target.id === 'bq' && e.key === 'Enter') e.target.blur(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* =========================================================
   INÍCIO
   ========================================================= */
load(); render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && window.self === window.top && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
